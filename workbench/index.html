    '</div>' +

    /* ④ 近 7 天咖啡因趋势（内联 SVG 手写，不引图表库） */
    '<div class="card"><div class="card__hd"><h3>' + ic('barchart') + '近 7 天咖啡因</h3>' +
      '<span class="tag">mg</span></div>' +
      '<div class="card__bd">' + sparkBars(days, maxCaf) + '</div>' +
    '</div>';

  // ---- 局部渲染函数（供上面模板调用，保持单向依赖） ----
  function bar(label, val, lim, unit, color){
    const p = pct(val, lim);
    const bad = over(val, lim);
    const warn = near(val, lim);
    return '<div class="dk__bar">' +
      '<div class="dk__barhd"><span>' + esc(label) + '</span>' +
        '<b style="color:' + (bad ? 'var(--danger)' : warn ? 'var(--amber)' : 'var(--ink-2)') + '">' +
        val + unit + ' / ' + lim + unit + '</b></div>' +
      '<div class="dk__track"><i style="width:' + p + '%;background:' +
        (bad ? 'var(--danger)' : warn ? 'var(--amber)' : color) + '"></i></div>' +
    '</div>';
  }

  function sparkBars(days, max){
    const W = 100, H = 46, gap = 2;
    const bw = (W - gap * (days.length - 1)) / days.length;
    const limY = H - (DRINK_LIMIT.caffeine / max) * H;
    let s = '<div class="chart" data-chart style="position:relative;height:' + (H + 22) + 'px">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block">' +
      '<line x1="0" y1="' + limY.toFixed(1) + '" x2="' + W + '" y2="' + limY.toFixed(1) +
        '" stroke="var(--danger)" stroke-width="0.4" stroke-dasharray="2 2" opacity="0.55"/>';
    days.forEach((d, i) => {
      const h = max ? (d.caffeine / max) * H : 0;
      const x = i * (bw + gap);
      const over = d.caffeine > DRINK_LIMIT.caffeine;
      s += '<rect x="' + x.toFixed(2) + '" y="' + (H - h).toFixed(2) + '" width="' + bw.toFixed(2) +
        '" height="' + Math.max(h, 0.6).toFixed(2) + '" rx="0.8" fill="' +
        (over ? 'var(--danger)' : 'var(--accent)') + '" opacity="' + (i === days.length - 1 ? '1' : '0.75') + '"/>';
    });
    s += '</svg><div style="display:flex;justify-content:space-between;margin-top:4px">' +
      days.map(d => '<span class="tiny" style="flex:1;text-align:center;color:var(--ink-4)">' + esc(d.label) + '</span>').join('') +
    '</div></div>';
    return s;
  }

  // ---- 事件绑定 ----
  $$('#view .dk__chip').forEach(b => b.onclick = () => openDrinkEditor(DRINK_PRESETS[Number(b.dataset.preset)]));
  $('#dkCustom').onclick = () => openDrinkEditor(null);
  drawToday();

  function drawToday(){
    const el = $('#dkToday');
    if (!today.length){
      el.innerHTML = '<div class="empty" style="border:0;padding:26px">' + ic('cup') +
        '<p>今天还没喝</p><small>点上面任一饮品，或「自定义」手动填写。</small></div>';
      return;
    }
    el.innerHTML = '<div class="list">' + today.map(d => {
      // 数据来源小标：让「官方实测值」和「AI 估算值」在列表里也分得清
      const hasOfficial = (d.src || []).includes('official');
      const hasAi = (d.src || []).includes('ai');
      const tag = hasOfficial ? '<i class="dk__tag dk__tag--official">官网</i>'
                : hasAi ? '<i class="dk__tag">AI估</i>' : '';
      return '<div class="li" data-id="' + escAttr(d.id) + '">' +
        '<div class="li__bd"><div class="li__t">' + esc(d.name) + tag + '</div>' +
          '<div class="li__m">' +
            '<span>' + ic('clock') + ' ' + esc(fmtTime(d.at)) + '</span>' +
            '<span>' + (Number(d.v) || 0) + 'ml</span>' +
            (d.c ? '<span>' + d.c + 'mg 咖啡因</span>' : '') +
            (d.s ? '<span>' + d.s + 'g 糖</span>' : '') +
            (d.k ? '<span>' + d.k + 'kcal</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="li__acts"><button class="del" data-dk="' + escAttr(d.id) + '" title="删除">' + ic('trash') + '</button></div>' +
      '</div>';
    }).join('') + '</div>';
    $$('[data-dk]', el).forEach(b => b.onclick = () => {
      const id = b.dataset.dk;
      const one = (Store.db.drinks || []).find(x => x.id === id);
      modal({ title:'删除这条记录', desc:'「' + (one?.name || '') + '」将被移除。', okText:'删除', danger:true,
        onOk: () => {
          Store.mutate(db => { db.drinks = (db.drinks || []).filter(x => x.id !== id); });
          renderDrinks(); toast('ok', '已删除');
        }});
    });
  }
}

/** 记一杯：preset 为预设项，null 表示完全自定义
 *  opts.type：可选，直接指定饮品名（如从 AI 查值入口进来） */
function openDrinkEditor(preset){
  const now = new Date();
  // datetime-local 要求「本地时间」的 YYYY-MM-DDTHH:mm。
  // 不能用 toISOString().slice(0,16) —— 那是 UTC，东八区会差 8 小时。
  const nowInput = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) +
                   'T' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());

  // 打开时先看看名字是否命中瑞幸官方表，命中就直接带出准确值
  const presetName = preset ? preset.n : '';
  const hit = presetName ? matchLuckin(presetName) : null;
  const official = hit ? hit.row : null;

  const initC = official && official.c != null ? official.c : (preset ? preset.c : 0);
  const initK = official && official.k != null ? official.k : (preset ? preset.k : 0);
  const initS = preset ? preset.s : 0;

  const d = drawer({
    title: preset ? '记一杯 · ' + preset.n : '自定义饮品',
    sub: '数值可改，按你的实际杯量调整',
    body:
      '<div class="stack">' +
        '<label class="fld"><span>名称</span>' +
          '<input id="dkN" type="text" value="' + escAttr(presetName) + '" placeholder="例如：瑞幸 生椰拿铁" maxlength="30"></label>' +

        /* AI 查值入口 —— 放在名称下方，填完名字下一步就点它 */
        '<div class="dk__ai">' +
          '<button class="btn btn--sm" id="dkAi">' + ic('spark') + 'AI 查热量 / 咖啡因 / 糖</button>' +
          '<span class="dk__aihint" id="dkAiHint">' +
            (official
              ? '已命中瑞幸官方表：' + esc(official.n)
              : '填好名称和容量，点左边的按钮让 AI 估算') +
          '</span>' +
        '</div>' +
        '<div id="dkAiOut"></div>' +

        '<div class="row">' +
          '<label class="fld" style="flex:1"><span>容量 (ml)</span>' +
            '<input id="dkV" type="number" inputmode="numeric" min="0" max="3000" step="10" value="' + (preset ? preset.v : 355) + '"></label>' +
          '<label class="fld" style="flex:1"><span>咖啡因 (mg)<i class="dk__badge" id="dkBC"></i></span>' +
            '<input id="dkC" type="number" inputmode="numeric" min="0" max="1000" step="1" value="' + initC + '"></label>' +
        '</div>' +
        '<div class="row">' +
          '<label class="fld" style="flex:1"><span>添加糖 (g)<i class="dk__badge" id="dkBS"></i></span>' +
            '<input id="dkS" type="number" inputmode="numeric" min="0" max="200" step="1" value="' + initS + '"></label>' +
          '<label class="fld" style="flex:1"><span>热量 (kcal)<i class="dk__badge" id="dkBK"></i></span>' +
            '<input id="dkK" type="number" inputmode="numeric" min="0" max="2000" step="1" value="' + initK + '"></label>' +
        '</div>' +
        '<label class="fld"><span>时间</span>' +
          '<input id="dkT" type="datetime-local" value="' + nowInput + '"></label>' +
      '</div>',
    foot: '<button class="btn" id="dkCancel">取消</button>' +
          '<button class="btn btn--primary" id="dkSave">' + ic('check') + '记录</button>'
  });

  // 取消必须显式绑 close()：抽屉内部有 stopPropagation，靠冒泡到遮罩是不生效的。
  // 另外别用 data-x="c" 当钩子 —— drawer() 用 querySelector 只抓第一个，
  // 那个位置永远属于头部的 ×，底部按钮拿不到任何事件。
  $('#dkCancel', d.foot).onclick = () => d.close();

  /* ---------------- 数据来源标注 ----------------
   * 三个字段各自记住「这个值是怎么来的」，在标签上挂一个小徽标。
   * 官方实测值与 AI 估值必须能一眼分清 —— 否则用户会以为糖分也是官方数据。 */
  const src = {
    c: official && official.c != null ? 'official' : (preset && preset.c ? 'preset' : 'manual'),
    k: official && official.k != null ? 'official' : (preset && preset.k ? 'preset' : 'manual'),
    s: preset && preset.s ? 'preset' : 'manual'
  };
  const SRC_TEXT = { official: '官方', ai: 'AI估', preset: '参考', manual: '' };

  function paintBadges(){
    [['dkBC', 'c'], ['dkBK', 'k'], ['dkBS', 's']].forEach(([id, key]) => {
      const el = $('#' + id, d.body);
      if (!el) return;
      const t = SRC_TEXT[src[key]] || '';
      el.textContent = t;
      el.className = 'dk__badge' + (t ? ' dk__badge--' + src[key] : '');
    });
  }
  /** 用户手动改过输入框，来源就降级为「手动」 —— 不能继续挂着「官方」误导人 */
  function watchManual(id, key){
    const el = $('#' + id, d.body);
    if (el) el.addEventListener('input', () => { src[key] = 'manual'; paintBadges(); });
  }
  ['dkC:c', 'dkK:k', 'dkS:s'].forEach(p => watchManual(p.split(':')[0], p.split(':')[1]));
  paintBadges();

  /* ---------------- AI 查值 ---------------- */
  const aiBtn = $('#dkAi', d.body);
  const out = $('#dkAiOut', d.body);

  // 输入名字时实时看能不能命中官方表，给个即时反馈（不发请求，纯本地）
  const nameIn = $('#dkN', d.body);
  nameIn.addEventListener('blur', () => {
    const n = (nameIn.value || '').trim();
    const hit = matchLuckin(n);
    const h = $('#dkAiHint', d.body);
    if (!h) return;
    h.textContent = hit && hit.score >= 0.5
      ? '这个名字在瑞幸官方表里，点右侧按钮直接取官方值'
      : '填好名称和容量，点左侧按钮让 AI 估算';
  });

  aiBtn.onclick = async () => {
    const name = (nameIn.value || '').trim();
    if (!name){
      // 双通道反馈：toast 容易被忽略，输入框旁边再给一条内联提示
      out.innerHTML = notice('warn', '先填饮品名称', '例如「瑞幸 生椰拿铁」「珍珠奶茶」。');
      nameIn.focus();
      toast('warn', '先填饮品名称', '填好名字再点「AI 查值」。', 3500);
      return;
    }
    const vol = Number($('#dkV', d.body).value) || 355;

    // 走统一的默认 AI（设置页可指定；没指定则第一个有 Key 的）
    const prov = AI.pickDefault();
    if (!prov){
      out.innerHTML = notice('warn', '还没有可用的 AI 供应商',
        '去「AI 余额」页填一个 API Key，再到「设置 → 默认 AI」里选它。');
      return;
    }

    // ① 先查本地官方表 —— 零成本，命中就不用发请求
    const localHit = matchLuckin(name);
    const local = localHit && localHit.score >= 0.5 ? localHit.row : null;

    aiBtn.disabled = true;
    const oldHtml = aiBtn.innerHTML;
    aiBtn.innerHTML = ic('refresh') + '查询中…';
    out.innerHTML = '';

    try {
      // ② 需要 AI 的场景：没命中官方表，或命中了但缺值（官网部分产品没标咖啡因）
      const needAI = !local || local.c == null || local.k == null;
      let r = null, aiErr = null;

      if (needAI){
        try {
          r = await AI.estimateDrink(prov.id, { name, volume: vol, official: local });
        } catch (e){ aiErr = e; }
      }

      // ③ 合并结果：官方值优先，AI 只补缺
      const merged = { c: null, k: null, s: null };
      if (local){
        merged.c = local.c; merged.k = local.k;
      }
      if (r){
        if (merged.c == null) merged.c = r.caffeine;
        if (merged.k == null) merged.k = r.kcal;
        merged.s = r.sugar;
      }

      if (merged.c == null && merged.k == null && merged.s == null){
        out.innerHTML = notice('warn', '没查到数据',
          aiErr ? 'AI 返回异常：' + esc(aiErr.message) + '。可以手动填。' : '可以手动填写数值。');
        return;
      }

      // ④ 回填输入框并更新来源标注
      const fill = (id, key, v, from) => {
        if (v == null) return;
        $('#' + id, d.body).value = v;
        src[key] = from;
      };
      fill('dkC', 'c', merged.c, local && local.c != null ? 'official' : 'ai');
      fill('dkK', 'k', merged.k, local && local.k != null ? 'official' : 'ai');
      fill('dkS', 's', merged.s, 'ai');
      paintBadges();

      out.innerHTML = resultCard(local, r, aiErr, prov);

    } catch (e){
      out.innerHTML = notice('err', '查询失败', esc(e.message || '未知错误'));
    } finally {
      aiBtn.disabled = false;
      aiBtn.innerHTML = oldHtml;
    }
  };

  /** 内联 SVG 提示条（不引外部资源） */
  function notice(kind, title, desc){
    const iconName = kind === 'err' ? 'warn' : kind === 'warn' ? 'info' : 'check';
    const cls = kind === 'err' ? 'dk__msg--err' : kind === 'warn' ? 'dk__msg--warn' : 'dk__msg--ok';
    return '<div class="dk__msg ' + cls + '">' + ic(iconName, 'dk__msgIc') +
      '<div><b>' + esc(title) + '</b>' + (desc ? '<span>' + desc + '</span>' : '') + '</div></div>';
  }

  /** 查询结果卡片：显示数据来源与依据，让用户知道该信几分 */
  function resultCard(local, ai, err, prov){
    const rows = [];
    if (local){
      rows.push('<div class="dk__src"><b>瑞幸官网</b><span>' + esc(local.n) + '　' +
        (local.k != null ? '热量 ' + local.k + 'kcal' : '') +
        (local.c != null ? '　咖啡因 ' + local.c + 'mg' : '') +
        (local.d ? '<br><em>' + esc(local.d) + '</em>' : '') + '</span></div>');
    }
    if (ai){
      rows.push('<div class="dk__src"><b>AI 估算</b><span>' +
        '糖 ' + ai.sugar + 'g　热量 ' + ai.kcal + 'kcal　咖啡因 ' + ai.caffeine + 'mg' +
        (ai.basis ? '<br><em>' + esc(ai.basis) + '</em>' : '') +
        '<br><em>把握：' + ({ high: '较高', medium: '中等', low: '较低' }[ai.confidence] || '中等') +
        ' · 模型 ' + esc(ai.model) + '</em></span></div>');
    }
    const tip = local
      ? '热量和咖啡因来自瑞幸官网，糖分为 AI 估算（官网未公开）。数值会随杯型/甜度变化，可手动微调。'
      : '三项均为 AI 估算，仅供参考。如果包装上有标注，建议按实际填写。';
    if (err) rows.push('<div class="dk__src dk__src--warn"><b>部分失败</b><span>' + esc(err.message) + '</span></div>');
    return '<div class="dk__result">' + rows.join('') +
      '<p class="tiny">' + esc(tip) + '</p></div>';
  }

  $('#dkSave', d.body.parentNode).onclick = () => {
    const name = ($('#dkN', d.body).value || '').trim() || '未命名饮品';
    const num = (id, def) => { const v = Number($('#' + id, d.body).value); return isFinite(v) && v >= 0 ? v : def; };
    const tRaw = $('#dkT', d.body).value;
    const at = tRaw ? new Date(tRaw).getTime() : Date.now();
    const item = {
      id: uid(), name,
      v: num('dkV', 0), c: num('dkC', 0), s: num('dkS', 0), k: num('dkK', 0),
      at: isFinite(at) ? at : Date.now()
    };
    // 记下数据来源，列表里可以标出来（official=官网实测，ai=AI 估算，manual=手填）
    const tags = [];
    if (src.k === 'official' || src.c === 'official') tags.push('official');
    if (src.s === 'ai' || src.k === 'ai' || src.c === 'ai') tags.push('ai');
    if (tags.length) item.src = tags;
    Store.mutate(db => { db.drinks = db.drinks || []; db.drinks.push(item); db.demo = false; });
    d.close(); renderDrinks();
    toast('ok', '已记录「' + name + '」', '', 2200);
    Store.checkBackupHint();
  };
  setTimeout(() => $('#dkN', d.body)?.select?.(), 320);
}

/* ==========================================================================
   8. 备份 / 导出 / 导入
   ========================================================================== */
const Backup = {
  /** 导出全部数据（不限条数） */
  exportAll(){
    const payload = {
      _app: 'lifehub', _schema: SCHEMA, _version: 1,
      _exportedAt: new Date().toISOString(),
      _counts: {
        notes: Store.db.notes.length, money: Store.db.money.length,
        todo: Store.db.todo.length, habits: Store.db.habits.length,
        providers: Store.db.providers.length
      },
      settings: Store.db.settings,
      providers: Store.db.providers,
      notes: Store.db.notes, money: Store.db.money,
      todo: Store.db.todo, habits: Store.db.habits,
      createdAt: Store.db.createdAt, demo: Store.db.demo
    };
    const s = JSON.stringify(payload, null, 2);
    const ts = new Date();
    const name = 'lifehub-backup-' + dayKey(ts) + '-' + pad2(ts.getHours()) + pad2(ts.getMinutes()) + '.json';
    download(name, s);
    try { localStorage.setItem('lifehub.v1.lastExport', String(Date.now())); } catch(e){}
    toast('ok', '备份已导出', name + '（' + (new Blob([s]).size / 1024).toFixed(1) + ' KB，' + Store.count() + ' 条记录）', 6000);
  },

  /** 导入（合并或覆盖），不限条数 */
  openImport(){
    const fi = document.createElement('input');
    fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files && fi.files[0];
      if (f) this.handleFile(f);
    };
    fi.click();
  },

  async handleFile(file){
    let txt;
    try { txt = await file.text(); }
    catch (e){ toast('err', '读取文件失败', e.message); return; }
    await this.importText(txt, file.name);
  },

  /** 允许粘贴 JSON 文本导入 */
  openPaste(){
    modal({
      title: '粘贴 JSON 导入',
      desc: '把之前导出的备份内容整段粘贴进来即可。',
      okText: '解析并预览', wide: true,
      body: '<textarea class="ta" id="impTa" placeholder="粘贴 JSON…" style="min-height:220px;font-family:var(--f-num);font-size:12px"></textarea>',
      onOk: bd => {
        const t = $('#impTa', bd).value.trim();
        if (!t){ toast('warn', '还没有粘贴内容'); return false; }
        setTimeout(() => this.importText(t, '（粘贴内容）'), 60);
      }
    });
  },

  async importText(txt, sourceName){
    let raw;
    try { raw = JSON.parse(txt); }
    catch (e){
      this._showBad('JSON 语法错误', e.message, txt, sourceName);
      return;
    }
    let parsed;
    try { parsed = Store.normalize(raw); }
    catch (e){
      this._showBad('数据结构无法识别', e.message, txt, sourceName);
      return;
    }
    const c = {
      notes: parsed.notes.length, money: parsed.money.length,
      todo: parsed.todo.length, habits: parsed.habits.length,
      providers: parsed.providers.length
    };
    const total = c.notes + c.money + c.todo + c.habits;
    if (!total && !c.providers){
      toast('warn', '文件里没有可导入的数据', '可能是个空备份，或者格式不对。', 6000);
      return;
    }
    modal({
      title: '导入确认',
      desc: '来自「' + sourceName + '」，共识别出 ' + total + ' 条记录。',
      wide: true,
      body:
        '<div class="grid g-3" style="gap:10px">' +
          mini('笔记', c.notes) + mini('收支', c.money) + mini('待办', c.todo) +
          mini('习惯', c.habits) + mini('供应商', c.providers) + mini('当前已有', Store.count()) +
        '</div>' +
        '<div class="hr"></div>' +
        '<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">选择导入方式。合并会按 id 去重，不会覆盖你现有的记录。</p>' +
        '<div class="seg" id="impMode" style="width:100%">' +
          '<button data-m="merge" class="is-on" style="flex:1">合并（推荐）</button>' +
          '<button data-m="replace" style="flex:1">覆盖现有数据</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:10px">无论选哪种，导入前都会自动生成一份当前数据的快照，可在「存储与恢复」里回滚。</p>',
      okText: '开始导入',
      onOk: bd => {
        const mode = $('#impMode .is-on', bd)?.dataset.m || 'merge';
        this.applyImport(parsed, mode);
      },
      footer: ''
    });
    function mini(l, v){ return '<div class="stat" style="padding:11px 12px"><span>' + esc(l) + '</span><b style="font-size:22px">' + v + '</b></div>'; }
  },

  applyImport(p, mode){
    // 先做快照
    try { localStorage.setItem('lifehub.v1.preImport', JSON.stringify(Store.db)); } catch (e){}

    if (mode === 'replace'){
      Store.db = p;
      Store.db.demo = false;
      Store.save();
      toast('ok', '导入完成（覆盖）', '共 ' + Store.count() + ' 条记录已替换原有数据', 6000);
    } else {
      const byId = (arr) => new Map((arr || []).map(x => [x.id, x]));
      const mergeArr = (cur, inc) => {
        const m = byId(cur);
        let added = 0;
        (inc || []).forEach(x => { if (!m.has(x.id)){ m.set(x.id, x); added++; } });
        return { list: [...m.values()], added };
      };
      let added = 0;
      const n = mergeArr(Store.db.notes, p.notes); added += n.added;
      const mo = mergeArr(Store.db.money, p.money); added += mo.added;
      const td = mergeArr(Store.db.todo, p.todo); added += td.added;
      const hb = mergeArr(Store.db.habits, p.habits); added += hb.added;
      const pv = mergeArr(Store.db.providers, p.providers);
      Store.mutate(db => {
        db.notes = n.list; db.money = mo.list; db.todo = td.list;
        db.habits = hb.list; db.providers = pv.list;
        // 习惯打卡日期取并集
        p.habits.forEach(ph => {
          const t = db.habits.find(x => x.id === ph.id);
          if (t){ t.days = [...new Set([...(t.days || []), ...(ph.days || [])])].sort(); }
        });
        db.demo = false;
      });
      toast('ok', '导入完成（合并）', '新增 ' + added + ' 条，去重后共 ' + Store.count() + ' 条', 6000);
    }
    Store.checkBackupHint();
    go(location.hash.replace('#/', '') || 'weather');
  },

  /** 损坏文件的修复界面 */
  _showBad(kind, reason, rawTxt, sourceName){
    modal({
      title: '无法直接导入这个文件',
      desc: kind + '：' + reason,
      wide: true,
      okText: '尝试自动修复',
      cancelText: '关闭',
      body:
        '<div style="padding:13px 15px;border-radius:12px;background:var(--danger-soft);color:var(--ink-2);font-size:13px;line-height:1.65">' +
          '<b style="color:var(--danger)">原因：</b>' + esc(reason) +
        '</div>' +
        '<p class="hint" style="margin-top:12px">自动修复会尝试：① 去掉首尾多余字符；② 修补常见的中文引号与尾随逗号；③ 只提取能识别的记录。</p>' +
        '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--ink-3)">查看原始内容片段</summary>' +
        '<pre style="font-family:var(--f-num);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;overflow:auto;max-height:180px;margin-top:9px">' +
        esc(String(rawTxt).slice(0, 2500)) + '</pre></details>',
      onOk: () => {
        const fixed = this._repair(rawTxt);
        if (fixed){
          this.applyImport(fixed, 'merge');
        } else {
          toast('err', '修复失败', '这个文件的结构损坏比较严重，建议找到上一次的备份重新导入。', 8000);
        }
      }
    });
  },
  _repair(txt){
    let t = String(txt).trim();
    // 去 BOM 与常见包裹字符
    t = t.replace(/^\uFEFF/, '').replace(/^[^{[]*([{\[])/, '$1').replace(/([}\]])[^}\]`]*$/, '$1');
    // 全角引号 → 半角
    t = t.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'");
    // 尾随逗号
    t = t.replace(/,(\s*[}\]])/g, '$1');
    try { return Store.normalize(JSON.parse(t)); } catch (e){}
    // 最后一招：逐个提取对象数组
    const out = blankDB();
    out.demo = false;
    let got = false;
    ['notes', 'money', 'todo', 'habits', 'providers'].forEach(k => {
      const re = new RegExp('"' + k + '"\\s*:\\s*\\[([\\s\\S]*?)\\]\\s*[,}]', 'm');
      const m = t.match(re);
      if (!m) return;
      const items = [];
      let depth = 0, cur = '', inStr = false, esc2 = false;
      for (const ch of m[1]){
        if (esc2){ cur += ch; esc2 = false; continue; }
        if (ch === '\\'){ cur += ch; esc2 = true; continue; }
        if (ch === '"'){ inStr = !inStr; cur += ch; continue; }
        if (!inStr){
          if (ch === '{') depth++;
          if (ch === '}'){ depth--; }
        }
        cur += ch;
        if (!inStr && depth === 0 && ch === '}'){
          try { items.push(JSON.parse(cur)); } catch (e){}
          cur = '';
        }
      }
      if (items.length){
        try {
          const norm = Store.normalize({ [k]: items, settings: out.settings, providers: out.providers });
          out[k] = norm[k];
          got = true;
        } catch (e){}
      }
    });
    return got ? out : null;
  },

function download(name, text){
  try {
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  } catch (e){ toast('err', '导出失败', e.message); }
}

  $('#stExp', d.body).onclick = () => Backup.exportAll();  $('#stImp', d.body).onclick = () => Backup.openImport();
  $('#stPanel', d.body).onclick = () => { d.close(); setTimeout(() => Backup.openPanel(), 260); };
  // 通勤设置：先关掉当前抽屉再打开，避免两层抽屉叠在一起
  $('#stCommute', d.body).onclick = () => { d.close(); setTimeout(() => openCommuteSettings(), 260); };
}

function applyTheme(){
  const t = Store.db?.settings?.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.setAttribute('content', dark ? '#17181a' : '#f6f3ee');
}

/* ==========================================================================
   10. 路由 / 导航 / 顶栏
   ========================================================================== */
const VIEWS = [
  { id:'weather', name:'今日',   icon:'home',   sub:'天气与生活提示', render:() => renderWeather() },
  { id:'balance', name:'AI 余额', icon:'wallet', sub:'供应商账户与用量', render:() => renderBalance() },
  { id:'news',    name:'热榜',   icon:'news',   sub:'今日资讯与 AI 摘要', render:() => renderNews() },
  { id:'notes',   name:'笔记',   icon:'file',   sub:'随手记下的想法', render:() => renderNotes() },
  { id:'money',   name:'收支',   icon:'barchart',sub:'记账与消费结构', render:() => renderMoney() },
  { id:'todo',    name:'待办',   icon:'list',   sub:'要做的事与截止日期', render:() => renderTodo() },
  { id:'habits',  name:'习惯',   icon:'jar',    sub:'每天坚持的一点小事', render:() => renderHabits() },
  { id:'drinks',  name:'饮品',   icon:'cup',    sub:'咖啡因 · 糖 · 热量', render:() => renderDrinks() }
];
let CUR = '';

function buildNav(){
  // logo 右下角挂一个版本徽标：PC 侧边栏和手机底部栏都能看到，一眼知道跑的是哪一版
  const logo = $('#rail .rail__logo');
  if (logo){
    logo.innerHTML = '日<span class="rail__ver">v' + APP_VER + '</span>';
    logo.title = APP_NAME + ' · 版本 v' + APP_VER;
  }
  $('#railNav').innerHTML = VIEWS.map(v =>
    '<button class="navbtn" data-v="' + v.id + '" title="' + esc(v.name) + '">' + ic(v.icon) + '<span>' + esc(v.name) + '</span></button>').join('');

  /* ---- 手机端菜单抽屉（与侧栏同源，一份数据两处渲染） ---- */
  const ml = $('#mNavList');
  if (ml){
    ml.innerHTML = VIEWS.map(v =>
      '<button class="mitem" data-mv="' + v.id + '">' + ic(v.icon) +
        '<span class="mitem__tx"><b>' + esc(v.name) + '</b><small>' + esc(v.sub) + '</small></span>' +
      '</button>').join('');
    $$('[data-mv]', ml).forEach(b => b.onclick = () => { closeMenu(); go(b.dataset.mv); });
  }
  const mf = $('#mNavFoot');
  if (mf){
    mf.innerHTML =
      '<button class="mtool" data-mact="theme" title="切换深浅色">' + ic('sun') + '<span>深浅色</span></button>' +
      '<button class="mtool" data-mact="backup" title="备份与导出">' + ic('shield') + '<span>备份</span></button>' +
      '<button class="mtool" data-mact="settings" title="设置">' + ic('gear') + '<span>设置</span></button>';
  }
  const mv = $('#mNavVer'); if (mv) mv.textContent = 'v' + APP_VER;
  if ($('#menuLabel')) $('#menuLabel').textContent = (VIEWS.find(v => v.id === CUR) || VIEWS[0]).name;

  $('#railFoot').innerHTML =
    // 宽高交给 .rail__foot .navbtn（46×44，与导航按钮一致），不写内联 style ——
    // 内联优先级最高，CSS 想统一调整时永远打不过它。
    '<button class="btn btn--ghost btn--icon btn--sm navbtn" data-act="theme" title="切换深浅色">' + ic('sun') + '</button>' +
    '<button class="btn btn--ghost btn--icon btn--sm navbtn" data-act="backup" title="备份与导出">' + ic('shield') + '</button>' +
    '<button class="btn btn--ghost btn--icon btn--sm navbtn" data-act="settings" title="设置">' + ic('gear') + '</button>';
  $$('[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
  const doAct = act => {
    if (act === 'settings') openSettings();
    else if (act === 'backup') Backup.openPanel();
    else {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      Store.db.settings.theme = cur; Store.save(); applyTheme();
      toast('ok', cur === 'dark' ? '已切到深色' : '已切到浅色', '', 1800);
    }
  };
  $$('[data-act]').forEach(b => b.onclick = () => doAct(b.dataset.act));
  $$('[data-mact]').forEach(b => b.onclick = () => { closeMenu(); doAct(b.dataset.mact); });

  // 菜单开关：按钮 / 关闭按钮 / 遮罩 / Esc
  const bm = $('#btnMenu'), mn = $('#mNav'), sc = $('#mScrim');
  if (bm) bm.onclick = openMenu;
  if ($('#mNavX')) $('#mNavX').onclick = closeMenu;
  if (sc) sc.onclick = closeMenu;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
}

function openMenu(){
  const mn = $('#mNav'), sc = $('#mScrim'), bm = $('#btnMenu');
  if (!mn) return;
  mn.classList.add('is-on'); sc.classList.add('is-on');
  document.body.classList.add('mnav-open');
  if (bm) bm.setAttribute('aria-expanded', 'true');
}
function closeMenu(){
  const mn = $('#mNav'), sc = $('#mScrim'), bm = $('#btnMenu');
  if (!mn || !mn.classList.contains('is-on')) return;
  mn.classList.remove('is-on'); sc.classList.remove('is-on');
  document.body.classList.remove('mnav-open');
  if (bm) bm.setAttribute('aria-expanded', 'false');
}

function go(id){
  if (!VIEWS.find(v => v.id === id)) id = 'weather';
  CUR = id;
  const v = VIEWS.find(x => x.id === id);
  $$('[data-v]').forEach(b => b.classList.toggle('is-on', b.dataset.v === id));
  $$('[data-mv]').forEach(b => b.classList.toggle('is-on', b.dataset.mv === id));
  const mlb = $('#menuLabel'); if (mlb) mlb.textContent = v.name;
  $('#ttl').innerHTML = esc(v.name) + '<em>' + esc(greeting()) + '</em>';
  $('#sub').innerHTML = esc(v.sub) + '<span class="topbar__ver" title="' + escAttr(APP_NAME) + ' · 构建于 ' + escAttr(APP_BUILD) + '">v' + esc(APP_VER) + '</span>';
  WxCanvas.stop();
  location.hash = '#/' + id;
  v.render();
  renderTopActs(id);
}
function greeting(){
  const h = new Date().getHours();
  if (h < 6) return '夜深了，早点休息';
  if (h < 9) return '早上好，新的一天';
  if (h < 12) return '上午好，慢慢来';
  if (h < 14) return '中午好，记得吃饭';
  if (h < 18) return '下午好，喝口水';
  if (h < 22) return '晚上好';
  return '夜深了，别太累';
}
function renderTopActs(id){
  const box = $('#acts');
  const u = Store.usage();
  box.innerHTML =
    '<span class="tag tiny" style="display:none" id="tagUsage">' + u.items + ' 条 · ' + u.kb.toFixed(1) + 'KB</span>' +
    '<button class="btn btn--sm" id="actBak">' + ic('save') + '<span class="hide-sm">备份</span></button>' +
    '<button class="btn btn--sm btn--icon" id="actGear" title="设置">' + ic('gear') + '</button>';
  const su = $('#tagUsage');
  if (su && innerWidth > 900) su.style.display = '';
  $('#actBak').onclick = () => Backup.openPanel();
  $('#actGear').onclick = () => openSettings();
}

/* ==========================================================================
   11. 启动
   ========================================================================== */
function boot(){
  // 存储加载 + 损坏处理
  Store.load();
  applyTheme();

  // 记录演示数据 id，便于「清空演示数据」精确移除
  if (Store.db.demo){
    const demo = seedDemo();
    const existed = Store.db.notes.length || Store.db.money.length || Store.db.todo.length || Store.db.habits.length || Store.db.drinks.length || Store.db.providers.some(p => p.key);
    if (!existed){
      Store.db.notes = demo.notes;
      Store.db.money = demo.money;
      Store.db.todo = demo.todo;
      Store.db.habits = demo.habits;
      Store.db.drinks = demo.drinks;
      Store._demoIds = {
        money: demo.money.map(x => x.id),
        todo: demo.todo.map(x => x.id),
        habits: demo.habits.map(x => x.id),
        drinks: demo.drinks.map(x => x.id)
      };
      Store.save();
    } else {
      Store._demoIds = { money: [], todo: [], habits: [], drinks: [] };
    }
  } else {
    Store._demoIds = { money: [], todo: [], habits: [], drinks: [] };
  }

  // 数据损坏 / 恢复提示（读取加载阶段的快照，避免被后续 save 覆盖）
  const issue = Store._loadIssue;
  if (issue && issue.kind === 'corrupt'){
    setTimeout(() => {
      toast('err', issue.recovered ? '本地数据损坏，已从快照恢复' : '本地数据损坏，已重置',
        issue.reason + (issue.recovered
          ? ' 已自动回滚到最近一次完好的快照，请检查内容是否完整。'
          : ' 没有找到可用快照，已重置为初始状态。建议尽快导入之前的备份。'), 0, [
        { text: '去导入备份', fn: () => Backup.openImport() },
        { text: '存储与恢复', fn: () => Backup.openPanel() },
        { text: '我知道了', fn: () => {} }
      ]);
    }, 600);
  } else if (issue && issue.kind === 'repaired'){
    setTimeout(() => toast('warn', '数据已自动修复', issue.reason + ' 现有记录不受影响。', 8000, [
      { text: '存储与恢复', fn: () => Backup.openPanel() }
    ]), 600);
  } else if (Store._recoveredFrom === 'bak'){
    setTimeout(() => toast('warn', '已从快照恢复', '上次的数据写入似乎中断了，已回滚到最近的完好状态。', 8000, [
      { text: '查看详情', fn: () => Backup.openPanel() }
    ]), 600);
  }

  buildNav();

  // 主题跟随系统变化
  matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change', () => {
    if ((Store.db.settings.theme || 'auto') === 'auto') applyTheme();
  });

  // 路由
  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#/', '') || (localStorage.getItem('lifehub.v1.home') || 'weather');
    if (id !== CUR) go(id);
  });

  // 窗口变化：重绘天气画布
  window.addEventListener('resize', debounce(() => {
    const cv = $('#wxCv');
    if (cv) WxCanvas.resize(cv);
  }, 250));

  // 数据变更 → 同步顶栏用量
  Store.onChange = () => {
    const u = Store.usage();
    const t = $('#tagUsage');
    if (t) t.textContent = u.items + ' 条 · ' + u.kb.toFixed(1) + 'KB';
  };

  // 全局快捷键
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { '1':'weather','2':'balance','3':'news','4':'notes','5':'money','6':'todo','7':'habits' };
    if (map[e.key]){ go(map[e.key]); return; }
    if (e.key === 'b' || e.key === 'B'){ Backup.openPanel(); }
    if (e.key === 'r' || e.key === 'R'){ if (CUR === 'weather') renderWeather(); else if (CUR === 'news') News.fetchAll(); }
  });

  // 页面隐藏时强制落盘一次
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') Store.save();
  });
  window.addEventListener('beforeunload', () => Store.save());

  // 首次进入引导
  const started = localStorage.getItem('lifehub.v1.started');
  const id = location.hash.replace('#/', '') || (localStorage.getItem('lifehub.v1.home') || 'weather');
  go(id);

  if (!started){
    try { localStorage.setItem('lifehub.v1.started', '1'); } catch(e){}
    setTimeout(() => showHello(), 700);
  }

  // 预取天气（已保存城市，静默）
  setTimeout(() => {
    if (CUR !== 'weather' && Store.db.settings.city) {
      Weather.fetch(Store.db.settings.city, true).then(d => {
        Store.db.settings.lastWeather = { data: d, at: Date.now() }; Store.save();
      }).catch(() => {});
    }
  }, 2600);

  // 备份提醒检查
  setTimeout(() => Store.checkBackupHint(), 1800);
}

function showHello(){
  modal({
    title: '欢迎用上「日常」',
    desc: '一个装自己生活的小台子，所有数据都留在这台设备上。',
    wide: true,
    okText: '开始使用',
    cancelText: '',
    body:
      '<div class="stack">' +
        '<div style="display:grid;gap:9px">' +
          item('loc', '天气', '默认按网络定位显示当前城市，也可以手动搜索切换。数据来自公开免费接口。') +
          item('wallet', 'AI 余额', '已预置 DeepSeek、Xiaomi MiMo、Moonshot，填入 API Key 即可查余额；自定义项可填任意 OpenAI 兼容地址。') +
          item('news', '热榜与 AI 摘要', '可同时抓取多个平台的榜单，再让模型帮你读成摘要，支持多个模型交叉对比。') +
          item('file', '笔记 · 收支 · 待办 · 习惯', '输入即保存，关闭页面也不会丢。每满 20 条会提醒你备份一次。') +
        '</div>' +
        '<div class="hello__warn" style="padding:12px 14px;border-radius:12px;background:var(--amber-soft);font-size:12.5px;line-height:1.65;color:var(--ink-2)">' +
          ic('warn', 'noteIc') + ' 数据存在浏览器里，清理浏览器数据会一并清掉。<b>记得偶尔导出备份</b>，在左侧「备份」里可以随时导出。' +
        '</div>' +
        '<p class="tiny muted" style="margin:0">当前是演示状态，已经预置了几条示例记录，可以在「备份 → 清空演示数据」里一键移除。</p>' +
      '</div>'
  });
  function item(i, t, s2){
    return '<div style="display:flex;gap:11px;align-items:flex-start">' +
      '<div class="hello__feat">' +
      ic(i) + '</div><div><b style="font-size:13.5px">' + esc(t) + '</b>' +
      '<div class="tiny" style="color:var(--ink-3);line-height:1.6">' + esc(s2) + '</div></div></div>';
  }
}

// 启动
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
