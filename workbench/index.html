<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<meta name="description" content="泛生活人群的集成式生活工作台：天气、AI 余额、新闻热榜、备忘录、开销、待办、习惯打卡。纯本地存储，数据自持。">
<title>日常 · 生活工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23c2603f'/%3E%3Cpath d='M30 52l14 14 26-30' stroke='%23fff' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活工作台">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="assets/style.css">
<style>
.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f6f3ee;color:#6b6256;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){.boot-loader{background:#17181a;color:#a59c8f}}
.boot-loader__spin{width:40px;height:40px;border:4px solid rgba(194,96,63,.22);border-top-color:#c2603f;border-radius:50%;animation:blspin .9s linear infinite}
@keyframes blspin{to{transform:rotate(360deg)}}
.boot-loader__t{font-size:15px;letter-spacing:.04em}
.boot-loader__p{font-size:12px;opacity:.65}
.boot-loader--hide{opacity:0;transition:opacity .35s ease}
</style>
</head>
<body>
<div class="app">
  <!-- ===================== 侧拉栏（桌面） / 底部导航（手机） ===================== -->
  <nav class="rail" id="rail" role="navigation" aria-label="主导航">
    <div class="rail__logo" title="日常 · 生活工作台">日</div>
    <div class="rail__nav" id="railNav"></div>
    <div class="rail__sep"></div>
    <div class="rail__foot" id="railFoot"></div>
  </nav>

  <!-- ===================== 主区域 ===================== -->
  <main class="main">
    <header class="topbar">
      <!-- 手机端：菜单按钮 + 当前页标题；桌面端隐藏按钮 -->
      <button class="topbar__menu" id="btnMenu" aria-label="打开菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="topbar__menuLabel" id="menuLabel">今日</span>
      </button>
      <div class="topbar__t">
        <h1 id="ttl">今日</h1>
        <div class="topbar__sub" id="sub"></div>
      </div>
      <div class="topbar__acts" id="acts"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- ===================== 手机端菜单抽屉 ===================== -->
<div class="mscrim" id="mScrim"></div>
<aside class="mnav" id="mNav" role="dialog" aria-modal="true" aria-label="菜单">
  <div class="mnav__hd">
    <div class="mnav__brand">
      <span class="mnav__logo">日</span>
      <span class="mnav__name">日常 · 生活工作台<em id="mNavVer">v1.19</em></span>
    </div>
    <button class="mnav__x" id="mNavX" aria-label="关闭菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="mnav__list" id="mNavList"></div>
  <div class="mnav__ft" id="mNavFoot"></div>
</aside>

<!-- 抽屉 / 弹层挂载点 -->
<div id="layer"></div>
<!-- 吐司挂载点 -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<!-- 隐藏文件输入 -->
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<div id="bootLoader" class="boot-loader">
  <div class="boot-loader__spin"></div>
  <div class="boot-loader__t">生活工作台</div>
  <div class="boot-loader__p" id="bootProg">正在加载…</div>
</div><script src="js/loader.js"></script>
</body>
</html>
