const Store = {
  db: null,
  corrupt: false,
  lastErr: '',
  _failShown: false,

  /** 数据修复：把任意输入规整为合法结构 */
  normalize(raw){
    const base = blankDB();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('根节点不是对象');
    const out = base;
    out.createdAt = Number(raw.createdAt) || Date.now();
    out.demo = !!raw.demo;
    // settings
    if (raw.settings && typeof raw.settings === 'object'){
      const s = raw.settings;
      if (typeof s.theme === 'string' && ['auto','light','dark'].includes(s.theme)) out.settings.theme = s.theme;
      if (s.city && typeof s.city === 'object' && typeof s.city.name === 'string'){
        out.settings.city = {
          name: String(s.city.name).slice(0, 40),
          lat: Number(s.city.lat) || 22.54554,
          lon: Number(s.city.lon) || 114.0683,
          region: String(s.city.region || '').slice(0, 40),
          manual: !!s.city.manual,
          source: String(s.city.source || 'manual')
        };
      }
      if (Array.isArray(s.cityHistory)) out.settings.cityHistory = s.cityHistory.slice(0, 30).map(c => ({
        name: String(c?.name || '').slice(0, 40), lat: Number(c?.lat) || 0,
        lon: Number(c?.lon) || 0, region: String(c?.region || '').slice(0, 40)
      })).filter(c => c.name);
      if (Array.isArray(s.newsSources)) out.settings.newsSources = s.newsSources.filter(x => typeof x === 'string').slice(0, 30);
      if (typeof s.newsAI === 'string') out.settings.newsAI = s.newsAI;
      // 默认 AI（v1.16）：只做字符串登记，合法性交给 AI.pickDefault() 运行时判断。
      // 这里不校验 id 是否存在 —— 供应商是后加载的，normalize 阶段拿到的是原始数组，
      // 在这里判断容易误杀；且用户删掉供应商后 id 会短暂失效，运行时回退更稳。
      if (typeof s.defaultAI === 'string') out.settings.defaultAI = s.defaultAI.slice(0, 60);
      if (s.lastNews && typeof s.lastNews === 'object') out.settings.lastNews = s.lastNews;
      if (s.lastWeather && typeof s.lastWeather === 'object') out.settings.lastWeather = s.lastWeather;
      out.settings.backupHint = clamp(Number(s.backupHint) || 20, 5, 500);
      if (['expense','income'].includes(s.moneyMode)) out.settings.moneyMode = s.moneyMode;
      // 通勤设置：老数据没有这个字段，缺省保持关闭（blankDB 里的默认值）。
      // 用户显式存过才覆盖，避免把老用户强行拉进通勤模式。
      if (s.commute && typeof s.commute === 'object'){
        const c = s.commute;
        out.settings.commute = {
          on: !!c.on,
          goH: clamp(Number(c.goH) ?? 8, 0, 23),
          goM: clamp(Number(c.goM) ?? 0, 0, 59),
          homeH: clamp(Number(c.homeH) ?? 18, 0, 23),
          homeM: clamp(Number(c.homeM) ?? 30, 0, 59),
          workdays: Array.isArray(c.workdays)
            ? c.workdays.map(Number).filter(n => n >= 0 && n <= 6).slice(0, 7)
            : [1,2,3,4,5]
        };
      }
    }
    // providers
    if (Array.isArray(raw.providers)){
      out.providers = raw.providers.map(p => ({
        id: String(p?.id || uid()),
        name: String(p?.name || '未命名').slice(0, 40),
        kind: String(p?.kind || 'custom'),
        key: String(p?.key || ''),
        base: String(p?.base || '').slice(0, 300),
        color: String(p?.color || '#bd5f3e').slice(0, 20),
        letter: String(p?.letter || (String(p?.name || 'A')[0] || 'A')).slice(0, 2),
        bal: p?.bal === null || p?.bal === undefined ? null : Number(p.bal),
        balAt: Number(p?.balAt) || 0,
        balErr: String(p?.balErr || ''),
        consoleUrl: safeUrl(p?.consoleUrl) || '',
        models: Array.isArray(p?.models) ? p.models.filter(m => typeof m === 'string').slice(0, 20) : []
      }));
      if (!out.providers.length) out.providers = seedProviders();
      out.providers = migrateProviders(out.providers);
    }
    const arr = (v) => Array.isArray(v) ? v : [];
    out.notes = arr(raw.notes).slice(0, 5000).map(n => ({
      id: String(n?.id || uid()), title: String(n?.title || '无标题').slice(0, 200),
      body: String(n?.body || '').slice(0, 20000),
      tags: arr(n?.tags).filter(x => typeof x === 'string').slice(0, 12),
      pin: !!n?.pin, color: String(n?.color || '').slice(0, 12),
      createdAt: Number(n?.createdAt) || Date.now(), updatedAt: Number(n?.updatedAt) || Date.now()
    }));
    out.money = arr(raw.money).slice(0, 20000).map(m => ({
      id: String(m?.id || uid()),
      type: m?.type === 'income' ? 'income' : 'expense',
      amount: Math.abs(Number(m?.amount) || 0),
      cat: String(m?.cat || '其他').slice(0, 24),
      note: String(m?.note || '').slice(0, 200),
      date: /^\d{4}-\d{2}-\d{2}$/.test(m?.date) ? m.date : dayKey(),
      createdAt: Number(m?.createdAt) || Date.now()
    }));
    out.todo = arr(raw.todo).slice(0, 5000).map(x => ({
      id: String(x?.id || uid()), text: String(x?.text || '').slice(0, 400),
      done: !!x?.done, due: /^\d{4}-\d{2}-\d{2}$/.test(x?.due) ? x.due : '',
      pri: clamp(Number(x?.pri) || 0, 0, 3), createdAt: Number(x?.createdAt) || Date.now()
    })).filter(x => x.text);
    out.habits = arr(raw.habits).slice(0, 200).map(h => ({
      id: String(h?.id || uid()), name: String(h?.name || '习惯').slice(0, 60),
      color: String(h?.color || 'sage').slice(0, 12),
      days: arr(h?.days).filter(d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)).slice(0, 4000),
      createdAt: Number(h?.createdAt) || Date.now()
    })).filter(h => h.name);
    // 饮品记录：v=容量ml  s=糖g  c=咖啡因mg  k=热量kcal  at=时间戳
    // src（v1.15 新增）=数据来源标记数组，取值 official（瑞幸官网实测）/ ai（AI 估算）。
    // 忘登记就会像 v1.12 那样「记录了，刷新就没了」—— normalize 是逐字段重建。
    out.drinks = arr(raw.drinks).slice(0, 20000).map(x => ({
      id: String(x?.id || uid()), name: String(x?.name || '饮品').slice(0, 24),
      v: clamp(Number(x?.v) || 0, 0, 3000),
      s: clamp(Number(x?.s) || 0, 0, 200),
      c: clamp(Number(x?.c) || 0, 0, 1000),
      k: clamp(Number(x?.k) || 0, 0, 2000),
      at: Number(x?.at) || Date.now(),
      src: arr(x?.src).filter(t => t === 'official' || t === 'ai').slice(0, 4)
    })).filter(x => x.name);
    return out;
  },

  /** 启动加载 */
  load(){
    // 每轮加载重置状态
    this.corrupt = false; this.lastErr = ''; this._recoveredFrom = null;
    this._loadIssue = null;          // 供 boot 阶段读取的快照，不会被后续 save 覆盖
    let raw = null;
    try { raw = localStorage.getItem(LS_MAIN); }
    catch (e){ this.lastErr = '浏览器拒绝访问本地存储：' + e.message; this.corrupt = false; this.db = blankDB(); return this; }

    if (!raw){ this.db = blankDB(); return this; }

    let parsed;
    try { parsed = JSON.parse(raw); }
    catch (e){
      // JSON 损坏 → 尝试备份
      this.corrupt = true;
      this.lastErr = '主数据不是合法 JSON：' + e.message;
      const recovered = this._tryBak();
      this.db = recovered || blankDB();
      this._loadIssue = { kind:'corrupt', reason:this.lastErr, recovered:!!recovered };
      return this;
    }
    try { this.db = this.normalize(parsed); }
    catch (e){
      this.corrupt = true;
      this.lastErr = '数据结构异常：' + e.message;
      const recovered = this._tryBak();
      this.db = recovered || blankDB();
      this._loadIssue = { kind:'corrupt', reason:this.lastErr, recovered:!!recovered };
      return this;
    }
    // 结构合法但被规整过（字段缺失/类型错误）→ 轻量提示
    if (this._repairedSomething){
      this._loadIssue = { kind:'repaired', reason:'部分字段缺失或类型异常，已自动补全。' };
      this._repairedSomething = false;
    }
    return this;
  },
  _tryBak(){
    try {
      const b = localStorage.getItem(LS_BAK);
      if (!b) return null;
      const p = JSON.parse(b);
      const n = this.normalize(p);
      this._recoveredFrom = 'bak';
      return n;
    } catch (e){ return null; }
  },

  /** 主动校验当前数据（供「存储与恢复」里的自检按钮使用） */
  healthCheck(){
    try {
      const raw = localStorage.getItem(LS_MAIN);
      if (!raw) return { ok: false, msg: '本地没有找到数据。' };
      JSON.parse(raw);
      return { ok: true, msg: '数据结构完整，可以正常解析。' };
    } catch (e){
      return { ok: false, msg: '数据已损坏：' + e.message };
    }
  },

  /** 保存 —— 失败必须明确提示 */
  save(){
    const str = JSON.stringify(this.db);
    try {
      // 先滚动一份备份（仅当主数据本身可用时）
      const cur = localStorage.getItem(LS_MAIN);
      if (cur) { try { localStorage.setItem(LS_BAK, cur); } catch(e){} }
      localStorage.setItem(LS_MAIN, str);
      this._failShown = false;
      return true;
    } catch (e){
      const quota = /quota|exceed/i.test(e.name + e.message);
      const msg = quota
        ? '本地存储空间已满，最新改动没能保存。建议先导出备份，再清理一些旧数据。'
        : '本地存储写入失败：' + e.message;
      if (!this._failShown){ this._failShown = true; persistFail(msg); }
      this.lastErr = msg;
      return false;
    }
  },

  /** 变更入口：改数据 → 立即落盘 → 重绘 */
  mutate(fn){
    try { fn(this.db); }
    catch (e){ toast('err','操作失败', e.message); return false; }
    const ok = this.save();
    if (ok) this.onChange && this.onChange();
    return ok;
  },

  /** 存储用量估算 */
  usage(){
    try {
      const s = localStorage.getItem(LS_MAIN) || '';
      const kb = new Blob([s]).size / 1024;
      return { bytes: new Blob([s]).size, kb: kb, items: this.count() };
    } catch (e){ return { bytes: 0, kb: 0, items: 0 }; }
  },
  count(){
    const d = this.db; if (!d) return 0;
    return (d.notes?.length || 0) + (d.money?.length || 0) + (d.todo?.length || 0) +
           (d.habits?.length || 0) + (d.drinks?.length || 0);
  },

  /** 检查是否该提醒备份 */
  checkBackupHint(){
    const n = this.count(), limit = this.db.settings.backupHint || 20;
    const marks = Math.floor(n / limit);
    const lastMark = Number(localStorage.getItem('lifehub.v1.lastHint') || 0);
    if (marks > lastMark){
      try { localStorage.setItem('lifehub.v1.lastHint', String(marks)); } catch(e){}
      toast('warn', '建议备份一下', '数据已累计 ' + n + ' 条。导出一份 JSON 存到安全的地方，多一份安心。', 9000, [
        { text: '立即导出', fn: () => Backup.exportAll() },
        { text: '稍后', fn: () => toast('ok','好','记得有空回来备份。', 3000) }
      ]);
      return true;
    }
    return false;
  }
};

/** 持久化失败提示（独立于 toast，因为可能连 DOM 都不可用） */
function persistFail(msg){
  try {
    toast('err', '数据未能保存', msg + ' 请立即导出备份，不要关闭页面。', 15000, [
      { text: '导出备份', fn: () => Backup.exportAll() },
      { text: '查看详情', fn: () => Backup.openPanel() }
    ]);
  } catch (e){ alert('数据保存失败：' + msg); }
  try { console.error('[LifeHub] 持久化失败', msg); } catch(e){}
}

/* ==========================================================================
   3. UI 基础：吐司 / 弹窗 / 抽屉
   ========================================================================== */
function toast(kind, title, body, ms = 4200, actions = []){
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast toast--' + (kind || 'i');
  const ik = kind === 'ok' ? 'check' : kind === 'err' ? 'warn' : kind === 'warn' ? 'warn' : 'info';
  el.innerHTML =
    ic(ik) + '<div class="toast__bd"><b>' + esc(title) + '</b>' +
    (body ? '<small>' + esc(body) + '</small>' : '') + '</div>';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.text;
    b.onclick = () => { close(); a.fn && a.fn(); };
    el.appendChild(b);
  });
  const close = () => {
    if (!el.parentNode) return;
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 240);
  };
  const x = document.createElement('button');
  x.textContent = '关闭'; x.onclick = close;
  el.appendChild(x);
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  if (ms > 0) setTimeout(close, ms);
  return close;
}

/** 通用弹窗 */
function modal({ title, desc, body, okText = '确认', cancelText = '取消', onOk, danger = false, wide = false }){
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML =
    '<div class="modal__box" role="dialog" aria-modal="true"' + (wide ? ' style="width:min(680px,100%)"' : '') + '>' +
      '<div class="modal__hd"><h3>' + esc(title) + '</h3>' +
      (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div>' +
      '<div class="modal__bd"></div>' +
      '<div class="modal__ft">' +
        (cancelText ? '<button class="btn" data-x="c">' + esc(cancelText) + '</button>' : '') +
        '<button class="btn ' + (danger ? 'btn--danger' : 'btn--primary') + '" data-x="o">' + esc(okText) + '</button>' +
      '</div>' +
    '</div>';
  const bd = $('.modal__bd', wrap);
  if (typeof body === 'string') bd.innerHTML = body;
  else if (body instanceof Node) bd.appendChild(body);
  const layer = $('#layer');
  layer.appendChild(wrap);
  const close = () => { wrap.remove(); document.body.classList.remove('noscroll'); };
  document.body.classList.add('noscroll');
  // 用 $$ 遍历，别用 $（querySelector 只返回第一个）。
  // body 里若也写了 data-x="c"，$ 会永远只绑到那一个，弹窗自带按钮反而成了死键。
  $$('[data-x="c"]', wrap).forEach(b => b.addEventListener('click', close));
  $('[data-x="o"]', wrap).addEventListener('click', () => {
    const r = onOk && onOk(bd, close);
    if (r !== false) close();
  });
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', function k(e){
    if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', k); }
  });
  setTimeout(() => ($('.modal__ft .btn--primary', wrap) || $('.modal__ft .btn--danger', wrap))?.focus(), 30);
  return { close, body: bd };
}

/** 侧拉抽屉 */
function drawer({ title, sub, side = 'r', body, foot, onClose }){
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  const dr = document.createElement('aside');
  dr.className = 'drawer drawer--' + side;
  dr.setAttribute('role', 'dialog');
  dr.setAttribute('aria-modal', 'true');
  dr.innerHTML =
    '<div class="drawer__hd">' +
      '<h2>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</h2>' +
      '<button class="btn btn--ghost btn--icon btn--sm" data-x="c" title="关闭">' + ic('x') + '</button>' +
    '</div>' +
    '<div class="drawer__bd"></div>' +
    (foot ? '<div class="drawer__ft"></div>' : '');
  const bd = $('.drawer__bd', dr);
  if (typeof body === 'string') bd.innerHTML = body;
  else if (body instanceof Node) bd.appendChild(body);
  if (foot){
    const ft = $('.drawer__ft', dr);
    if (typeof foot === 'string') ft.innerHTML = foot;
    else ft.appendChild(foot);
  }
  wrap.appendChild(dr);
  $('#layer').appendChild(wrap);
  document.body.classList.add('noscroll');
  const api = { close: null, body: bd, el: dr, foot: $('.drawer__ft', dr), onClose: null };
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    wrap.classList.add('is-out'); dr.classList.add('is-out');
    setTimeout(() => { wrap.remove(); document.body.classList.remove('noscroll'); }, 250);
    document.removeEventListener('keydown', onKey);
    // 统一关闭回调：无论点 ×、点遮罩、按 Esc 还是显式 close()，都会走到这里。
    // 视图需要「关闭后刷新」时用 onClose 传入（或返回后赋 d.onClose），
    // 不要再改写 d.close —— 那样只有显式调用才生效。
    try { const fn = api.onClose || onClose; fn && fn(); } catch (e){ console.error(e); }
  };
  api.close = close;
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  // 同上：抽屉头部有 ×，foot 里也可能有「取消/完成」。
  // 用 $$ 全绑，任何位置的 data-x="c" 都能关抽屉。
  $$('[data-x="c"]', dr).forEach(b => b.addEventListener('click', close));
  wrap.addEventListener('click', close);
  dr.addEventListener('click', e => e.stopPropagation());
  return api;
}

/* SVG 图标选择器（供天气调用） */
const SVG = { ic };

/* ==========================================================================
   4. 天气模块
   ========================================================================== */
const WX_CACHE_MS = 15 * 60 * 1000; // 15 分钟内不重复请求

/* ── 天气文案中文化 ────────────────────────────────────────────────
   wttr.in 虽然支持 ?lang=zh，但实测它的 lang_zh 字段只是把英文原文
   原样复制了一份（{"value":"Light rain shower"}），并不翻译。所以想
   要中文只能自己映射。策略分三层，从可靠到兜底：
     1) 按 weatherCode 查 WWO 官方码表（最准，与文案无关）
     2) code 认不出时，按英文描述里的关键词匹配（覆盖未收录的新文案）
     3) 都不中则原样返回，至少不会显示空白
   中文命名参照「彩云天气 API · 天气现象」术语表：
     https://docs.caiyunapp.com/weather-api/v2/v2.6/tables/skycon.html
   即小/中/大/暴雨、小/中/大/暴雪、雾霾（不细分轻中重）、浮尘、沙尘、大风、雾。
   WWO 码表见 https://www.worldweatheronline.com/developer/api/docs/weather-icons.aspx */
const WWO_ZH = {
  113:'晴', 116:'多云', 119:'阴', 122:'阴',
  125:'雾霾', 134:'沙尘', 137:'沙尘', 143:'雾', 145:'雾', 148:'雾',
  149:'浮尘', 152:'雾霾', 154:'雾霾', 248:'雾', 251:'雾', 254:'雾', 260:'雾',
  176:'阵雨', 179:'阵雪', 182:'雨夹雪', 185:'冻毛毛雨',
  200:'雷阵雨', 227:'吹雪', 230:'暴雪',
  263:'毛毛雨', 266:'毛毛雨', 281:'冻雨', 284:'冻雨',
  293:'小雨', 296:'小雨', 299:'中雨', 302:'中雨',
  305:'大雨', 308:'大雨', 311:'冻雨', 314:'冻雨',
  317:'雨夹雪', 320:'雨夹雪', 323:'小雪', 326:'小雪',
  329:'中雪', 332:'中雪', 335:'大雪', 338:'大雪',
  350:'冰粒', 353:'阵雨', 356:'大雨', 359:'暴雨',
  362:'雨夹雪', 365:'雨夹雪', 368:'阵雪', 371:'大雪',
  374:'冰粒', 377:'冰粒',
  386:'雷阵雨', 389:'雷阵雨', 392:'雷阵雪', 395:'雷阵雪'
};
/** 英文描述关键词 → 中文（按「越具体越靠前」排序，命中即返回） */
const EN_ZH_PATTERNS = [
  [/freezing fog/i, '雾'], [/blizzard|storm snow/i, '暴雪'], [/blowing snow/i, '吹雪'],
  [/torrential rain|storm rain/i, '暴雨'],
  [/thunder|thundery/i, '雷阵雨'],
  [/heavy freezing drizzle/i, '冻雨'], [/freezing drizzle/i, '冻雨'],
  [/heavy freezing rain/i, '冻雨'], [/freezing rain/i, '冻雨'],
  [/heavy rain|storm_rain/i, '大雨'], [/moderate rain/i, '中雨'], [/light rain/i, '小雨'],
  [/drizzle/i, '毛毛雨'], [/rain shower|shower/i, '阵雨'], [/rain/i, '小雨'],
  [/heavy snow/i, '大雪'], [/moderate snow/i, '中雪'], [/light snow|snow/i, '小雪'],
  [/sleet/i, '雨夹雪'], [/ice pellet/i, '冰粒'],
  // 彩云术语：浮尘（Smoky haze）、沙尘（Sandstorm/Dust）、雾霾（Haze/Smog）、雾（Mist/Fog）
  [/smoky|dust|blowing dust/i, '浮尘'], [/sandstorm|sand/i, '沙尘'],
  [/smog|haze/i, '雾霾'], [/mist/i, '雾'], [/fog/i, '雾'], [/hail/i, '冰雹'],
  [/overcast/i, '阴'], [/partly cloudy|partly/i, '多云'], [/cloudy/i, '阴'],
  [/sunny|clear/i, '晴'], [/windy|gale/i, '大风']
];
/** WMO 码（open-meteo）→ 彩云天气术语。数字区间 0~99，与 WWO 表不重叠 */
const WMO_ZH = {
  0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',
  56:'冻雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',
  75:'大雪',77:'冰粒',80:'阵雨',81:'中雨',82:'大雨',85:'阵雪',86:'大雪',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'
};
/**
 * 天气描述转中文。
 * @param {number|string} code 天气码（优先按它查表）
 * @param {string} desc 上游返回的原文（中英不限）
 * @returns {string} 中文描述；已含中文则原样返回
 *
 * ⚠️ 两套码表数字不重叠，必须区分，否则会张冠李戴：
 *    WWO 码（wttr.in）  113 ~ 395
 *    WMO 码（open-meteo） 0 ~ 99
 *   例如 code=1 是 WMO 的「晴」，若误查 WWO 表会得到 113 对应的值。
 */
function wxText(code, desc){
  const raw = String(desc || '').trim();
  // 上游已经给了中文（如 open-meteo 的 wmoText 结果）就直接用
  if (/[\u4e00-\u9fa5]/.test(raw)) return raw;
  const c = Number(code);
  if (Number.isFinite(c)){
    // 按数字区间判断属于哪套码表
    if (c >= 113 && c <= 395 && WWO_ZH[c]) return WWO_ZH[c];
    if (c >= 0 && c <= 99 && WMO_ZH[c]) return WMO_ZH[c];
  }
  for (const [re, t] of EN_ZH_PATTERNS) if (re.test(raw)) return t;
  return raw || '未知';
}

/* ── 行政区名中文化 ────────────────────────────────────────────────
   wttr.in 返回的 region 是英文（Guangdong / Beijing），显示「广州 · Guangdong」
   很跳。这里映射中国省级行政区 + 常见国家名。查不到就原样返回。 */
const REGION_ZH = {
  'guangdong':'广东','guangxi':'广西','beijing':'北京','shanghai':'上海','tianjin':'天津',
  'chongqing':'重庆','hebei':'河北','shanxi':'山西','liaoning':'辽宁','jilin':'吉林',
  'heilongjiang':'黑龙江','jiangsu':'江苏','zhejiang':'浙江','anhui':'安徽','fujian':'福建',
  'jiangxi':'江西','shandong':'山东','henan':'河南','hubei':'湖北','hunan':'湖南',
  'hainan':'海南','sichuan':'四川','guizhou':'贵州','yunnan':'云南','shaanxi':'陕西',
  'gansu':'甘肃','qinghai':'青海','inner mongolia':'内蒙古','neimenggu':'内蒙古',
  'ningxia':'宁夏','xinjiang':'新疆','xizang':'西藏','tibet':'西藏',
  'hong kong':'中国香港','hong kong sar':'中国香港','macau':'中国澳门','macao':'中国澳门',
  'taiwan':'中国台湾',
  'china':'中国','japan':'日本','korea':'韩国','south korea':'韩国','singapore':'新加坡',
  'malaysia':'马来西亚','thailand':'泰国','vietnam':'越南','united states':'美国',
  'united kingdom':'英国','australia':'澳大利亚','canada':'加拿大'
};
/**
 * 地名/行政区名转中文。支持 "A · B" 这种拼接串，逐段转换。
 * @param {string} s 原始地区串
 */
function regionText(s){
  const raw = String(s || '').trim();
  if (!raw) return '';
  return raw.split(/\s*·\s*/).map(seg => {
    const t = seg.trim();
    if (!t) return '';
    if (/[\u4e00-\u9fa5]/.test(t)) return t;          // 已是中文
    const zh = REGION_ZH[t.toLowerCase()];
    return zh || t;
  }).filter(Boolean).join(' · ');
}

/** WMO / wttr 天气码 → 图标 + 文案 + 配色 */
function wxMeta(code, isDay = true, descText = ''){
  const c = Number(code);
  const d = (descText || '').toLowerCase();
  // wttr.in 用的是 WWO code，open-meteo 是 WMO code，这里做统一映射
  let key = 'cloud';
  if ([113, 116].includes(c) || /sunny|clear/i.test(d)) key = isDay ? 'sun' : 'moon';
  else if ([119, 122].includes(c) || /cloudy|overcast/i.test(d)) key = 'cloud';
  else if ([143, 248, 260].includes(c) || /fog|mist/i.test(d)) key = 'fog';
  else if ([200, 386, 389, 392, 395].includes(c) || /thunder/i.test(d)) key = 'storm';
  else if ([179, 182, 185, 227, 230, 320, 323, 326, 329, 332, 335, 338, 368, 371].includes(c) || /snow|sleet|blizzard/i.test(d)) key = 'snow';
  else if ([176, 263, 266, 281, 284, 293, 296, 299, 302, 305, 308, 311, 314, 353, 356, 359, 362, 365].includes(c) || /rain|drizzle|shower/i.test(d)) key = 'rain';
  else if (c === 0) key = isDay ? 'sun' : 'moon';
  else if ([1, 2].includes(c)) key = 'partly';
  else if (c === 3) key = 'cloud';
  else if ([45, 48].includes(c)) key = 'fog';
  else if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(c)) key = 'rain';
  else if ([71, 73, 75, 77, 85, 86].includes(c)) key = 'snow';
  else if ([95, 96, 99].includes(c)) key = 'storm';
  // 背景色走 CSS 变量：浅色/深色模式各自一套，避免深色模式下「白底白字」。
  // 变量定义见 part1_head.html 的 --wx-* ；此处只给 key，不再内联写死浅色。
  const tone = {

const Weather = {
  loading: false,

  /** 定位：多源降级，全部失败则回退到已保存城市 */
  async locate(){
    const provs = [
      async (sig) => {
        const d = await (await fetch('https://ipapi.co/json/', { signal: sig })).json();
        if (!d || d.error || !d.latitude) throw new Error('ipapi 无数据');
        return { name: d.city || d.region || '未知', lat: d.latitude, lon: d.longitude, region: [d.region, d.country_name].filter(Boolean).join(' · ') };
      },
      async (sig) => {
        const d = await (await fetch('https://ipwho.is/', { signal: sig })).json();
        if (!d || !d.success) throw new Error('ipwho 无数据');
        return { name: d.city || d.region || '未知', lat: d.latitude, lon: d.longitude, region: [d.region, d.country].filter(Boolean).join(' · ') };
      },
      async (sig) => {
        const d = await (await fetch('http://ip-api.com/json/?lang=zh-CN', { signal: sig })).json();
        if (!d || d.status !== 'success') throw new Error('ip-api 无数据');
        return { name: d.city || d.regionName || '未知', lat: d.lat, lon: d.lon, region: [d.regionName, d.country].filter(Boolean).join(' · ') };
      },
      async (sig) => {
        const d = await (await fetch('https://ipinfo.io/json', { signal: sig })).json();
        if (!d || !d.loc) throw new Error('ipinfo 无数据');

        return { name: d.city || d.region || '未知', lat: la, lon: lo, region: [d.region, d.country].filter(Boolean).join(' · ') };

  /** 拉取天气（wttr 主源 + open-meteo 备用） */
  async fetch(city, force = false){
    const ck = 'lifehub.v1.wx.' + city.lat.toFixed(2) + '.' + city.lon.toFixed(2);
    if (!force){
      try {
        const c = JSON.parse(localStorage.getItem(ck) || 'null');
        if (c && Date.now() - c.at < WX_CACHE_MS) return c.data;
      } catch (e){}
    }
    let data = null, errs = [];

    // 备源：open-meteo

    if (!data) throw new Error(errs.join(' / ') || '天气服务不可用');

  async _wttr(city){
    const url = 'https://wttr.in/' + city.lat.toFixed(4) + ',' + city.lon.toFixed(4) + '?format=j1&lang=zh';
    const d = await jjson(url, {}, 13000);
    const cur = d.current_condition && d.current_condition[0];
    if (!cur) throw new Error('无当前天气数据');
    const descZh = (cur.lang_zh && cur.lang_zh[0] && cur.lang_zh[0].value) || cur.weatherDesc?.[0]?.value || '';
    const area = d.nearest_area?.[0];
    const hours = [], today = d.weather?.[0];
    // hoursAll：今天 0~23 点的完整逐小时序列，供「通勤天气」按任意时刻取数。
    // 上面那个 hours 只截「当前时刻之后的 12 小时」，覆盖不到早班（如 8:00）。
    // 注意 wttr 的 hourly 是 3 小时间隔（每天只有 8 条：0/3/6/9/12/15/18/21），
    // 所以取到的是「最接近的一格」，精度不如 open-meteo 的逐小时。
    const mkHour = h => ({
      h: Math.floor(Number(h.time) / 100),
      t: Number(h.tempC),
      code: Number(h.weatherCode),
      desc: wxText(h.weatherCode, h.lang_zh?.[0]?.value || h.weatherDesc?.[0]?.value || ''),
      precip: Number(h.precipMM) || 0,
      chance: Number(h.chanceofrain) || 0
    });
    const hoursAll = (today?.hourly || []).map(mkHour)
      .filter(x => x.h >= 0 && x.h <= 23).sort((a, b) => a.h - b.h);
    // hoursByDay：按日期索引的逐小时表，供「过了下班时间看明天通勤」跨天取数。
    // 键是 YYYY-MM-DD，值是当天逐小时数组。
    const hoursByDay = {};
    (d.weather || []).forEach(w => {
      if (!w?.date) return;
      hoursByDay[w.date] = (w.hourly || []).map(mkHour)
        .filter(x => x.h >= 0 && x.h <= 23).sort((a, b) => a.h - b.h);
    });
    if (today?.hourly){
      const nowH = new Date().getHours();
      today.hourly.forEach(h => {
        const hh = Math.floor(Number(h.time) / 100);
        if (hh >= nowH) hours.push({ h: hh, t: Number(h.tempC), code: Number(h.weatherCode), desc: wxText(h.weatherCode, h.lang_zh?.[0]?.value || h.weatherDesc?.[0]?.value || '') });
      });
      today.hourly.slice(0, Math.max(0, 4 - hours.length)).forEach(h => {
        hours.push({ h: Math.floor(Number(h.time) / 100), t: Number(h.tempC), code: Number(h.weatherCode), desc: wxText(h.weatherCode, h.lang_zh?.[0]?.value || ''), next: true });
      });
    }
    // 用经纬度查 wttr 时会返回英文地名，若用户已知中文城市名则优先采用。
    // 注意：wttr 是「就近取站点」，边境地区常取到邻近行政区（如深圳坐标取到
    // 中国香港的 Ma Tso Lung）。用户手动选的城市名比它准，有中文名就一律用它。
    const wtName = area?.areaName?.[0]?.value || '';
    const cnName = city.name || '';
    const useCn = cnName && /[\u4e00-\u9fa5]/.test(cnName);
    // 地区串：优先用用户所在城市的省（中文，准确），否则退回 wttr 的英文并翻译
    const wtRegion = area?.region?.[0]?.value || '';
    const region = regionText(city.region || '') || regionText(wtRegion);
    // 城市名只保留市本身（去掉可能的「市 · 省」拼接），省名由 region 单独展示，
    // 否则会出现「广州 · 广东 · 广东」这种重复
    const place = String(useCn ? cnName : (wtName || cnName)).split(/\s*·\s*/)[0];
    return {
      src: 'wttr.in',
      place: place,
      region: region,
      temp: Number(cur.temp_C), feels: Number(cur.FeelsLikeC),
      code: Number(cur.weatherCode), desc: wxText(cur.weatherCode, descZh || cur.weatherDesc?.[0]?.value || ''),
      humidity: Number(cur.humidity), windK: Number(cur.windspeedKmph),
      windDir: cur.winddir16Point || '', pressure: Number(cur.pressure),
      vis: Number(cur.visibility), uv: Number(cur.uvIndex) || 0,
      precip: Number(cur.precipMM),
      obsTime: cur.observation_time || '',
      hours,
      hoursAll,
      hoursByDay,
      days: (d.weather || []).slice(0, 5).map(w => ({
        date: w.date, max: Number(w.maxtempC), min: Number(w.mintempC),
        code: Number(w.hourly?.[4]?.weatherCode ?? w.hourly?.[0]?.weatherCode ?? 113),
        desc: wxText(w.hourly?.[4]?.weatherCode ?? w.hourly?.[0]?.weatherCode, w.hourly?.[4]?.lang_zh?.[0]?.value || w.hourly?.[4]?.weatherDesc?.[0]?.value || ''),
        sunrise: w.astronomy?.[0]?.sunrise || '', sunset: w.astronomy?.[0]?.sunset || ''
      })),
      sunset: d.weather?.[0]?.astronomy?.[0]?.sunset || '',
      sunrise: d.weather?.[0]?.astronomy?.[0]?.sunrise || '',
      at: Date.now()
    };
  },

  async _om(city){
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon +

      '&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max' +
      '&timezone=auto&forecast_days=6';
    const d = await jjson(url, {}, 12000);
    const c = d.current; if (!c) throw new Error('无当前天气数据');
    const hours = [];
    const nowI = new Date();
    (d.hourly?.time || []).forEach((t, i) => {
      const dt = new Date(t);
      if (dt >= nowI && hours.length < 12) hours.push({ h: dt.getHours(), t: d.hourly.temperature_2m[i], code: d.hourly.weather_code[i], desc: '' });
    });
    // hoursAll：今天的完整逐小时序列（open-meteo 一天 24 条），供通勤天气取数。
    // 这里用「本地日期」而不是 toISOString()（那是 UTC，东八区晚 8 点后会差一天）
    const pad = n => String(n).padStart(2, '0');
    const nowD = new Date();
    const todayStr = nowD.getFullYear() + '-' + pad(nowD.getMonth() + 1) + '-' + pad(nowD.getDate());
    const mkHour = (t, i) => ({
      h: Number(String(t).slice(11, 13)),
      t: d.hourly.temperature_2m[i],
      code: d.hourly.weather_code[i],
      desc: wmoText(d.hourly.weather_code[i]),
      precip: d.hourly.precipitation?.[i] || 0,
      chance: 0
    });
    const hoursAll = (d.hourly?.time || []).map((t, i) => ({ t, i }))
      .filter(({ t }) => String(t).slice(0, 10) === todayStr)
      .map(({ t, i }) => mkHour(t, i)).sort((a, b) => a.h - b.h);
    // hoursByDay：按日期索引的逐小时表（open-meteo 给 6 天 × 24 小时，覆盖最全）
    const hoursByDay = {};
    (d.hourly?.time || []).forEach((t, i) => {
      const day = String(t).slice(0, 10);
      (hoursByDay[day] = hoursByDay[day] || []).push(mkHour(t, i));
    });
    Object.values(hoursByDay).forEach(arr => arr.sort((a, b) => a.h - b.h));
    const DAYNAME = ['周日','周一','周二','周三','周四','周五','周六'];
    return {
      src: 'open-meteo',
      place: city.name, region: regionText(city.region || ''),
      temp: c.temperature_2m, feels: c.apparent_temperature,
      code: c.weather_code, desc: wmoText(c.weather_code),
      humidity: c.relative_humidity_2m, windK: c.wind_speed_10m, windDir: '',
      pressure: c.surface_pressure, vis: (c.visibility || 0) / 1000, uv: d.daily?.uv_index_max?.[0] || 0,
      precip: c.precipitation || 0, obsTime: (c.time || '').slice(11, 16),
      hours,
      hoursAll,
      hoursByDay,
      days: (d.daily?.time || []).slice(0, 5).map((t, i) => ({
        date: t, max: d.daily.temperature_2m_max[i], min: d.daily.temperature_2m_min[i],
        code: d.daily.weather_code[i], desc: wmoText(d.daily.weather_code[i]),
        sunrise: fmtHM(d.daily.sunrise[i]), sunset: fmtHM(d.daily.sunset[i])

      sunrise: fmtHM(d.daily?.sunrise?.[0]), sunset: fmtHM(d.daily?.sunset?.[0]),
      at: Date.now()
    };
    function fmtHM(s){ return (s || '').slice(11, 16); }
    function wmoText(c){ return WMO_ZH[c] || '未知'; }
  },

  /**
   * 取「某天某个时刻」的天气，用于通勤卡。
   * 优先在当前数据源里找最接近的小时；找不到就退回到用日高低温估算，
   * 保证任何数据源（wttr 主 / open-meteo 备 / 缓存）都能出内容。
   * @param {object} d 天气数据
   * @param {number} hh 小时
   * @param {number} mm 分钟
   * @param {number} dayOffset 0=今天、1=明天（跨天时用 hoursByDay 取对应日期）
   * @returns {{h:number,t:number,code:number,desc:string,precip:number,est:boolean}|null}
   */
  atHour(d, hh, mm, dayOffset = 0){
    if (!d) return null;
    const target = hh + (mm || 0) / 60;
    // dayOffset=0 用 hoursAll（今日），>0 从 hoursByDay 里按日期取
    let pool = d.hoursAll || [];
    let day = d.days?.[0];
    if (dayOffset > 0){
      const dt = new Date();
      dt.setDate(dt.getDate() + dayOffset);
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
      pool = d.hoursByDay?.[key] || [];
      // 对应的日高低温也换成那一天，估算时才不会用错温度
      day = (d.days || []).find(x => String(x.date).slice(0, 10) === key) || d.days?.[dayOffset] || day;
    }
    const all = pool.filter(x => x && x.h != null);
    if (all.length){
      // 找时间上最接近的一条
      let best = all[0], gap = Infinity;
      for (const x of all){
        const g = Math.abs(x.h - target);
        if (g < gap){ gap = g; best = x; }
      }
      // 差距超过 1.5 小时就不算「这个时刻」的数据了，转用估算
      if (gap <= 1.5) return { ...best, est: false };
    }
    // 退化方案：按日高低温做一个正弦近似（最低出现在 5 点、最高出现在 14 点）
    if (!day || day.max == null || day.min == null) return null;
    const mid = (day.max + day.min) / 2, amp = (day.max - day.min) / 2;
    const t = mid + amp * Math.sin(((target - 9) / 24) * 2 * Math.PI);
    return { h: hh, t: Math.round(t * 10) / 10, code: day.code, desc: day.desc || '', precip: 0, chance: 0, est: true };
  },

  /** 生活化提示 */
  advice(d){
    if (!d) return '';
    const out = [];
    const t = d.temp, f = d.feels ?? t;
    const wet = /雨|雪|雷|毛毛/.test(d.desc);
    if (f <= 5) out.push('出门记得穿厚外套，围巾手套都用得上。');
    else if (f <= 12) out.push('有点凉，带件外套稳妥。');
    else if (f >= 33) out.push('体感偏热，多喝水、避开正午外出。');
    else if (f >= 28) out.push('天热，穿轻薄透气的衣物。');
    if (wet) out.push('有降水，伞带上，别淋着。');
    if (d.humidity >= 85 && t >= 26) out.push('湿度高、体感闷，室内注意通风。');
    if (d.humidity <= 32 && t >= 20) out.push('空气偏干，记得补水、润一下嗓子。');
    if ((d.uv || 0) >= 7) out.push('紫外线强，防晒别偷懒。');
    if ((d.windK || 0) >= 30) out.push('风不小，骑车小心些。');
    if ((d.vis || 10) <= 3) out.push('能见度低，开车放慢些。');
    const diff = d.max != null ? d.max - d.min : (d.days?.[0] ? d.days[0].max - d.days[0].min : 0);
    if (diff >= 12) out.push('昼夜温差大，早晚注意添衣。');
    if (!out.length) out.push('天气不错，适合出去走走。');
    return out.join(' ');
  },

  /** 温度→渐变色 */
  tempColor(t){
    const stops = [
      [-10, '#6b7fa8'], [0, '#5f8fb0'], [10, '#6ba3a8'], [18, '#7fae8a'],
      [24, '#c9a24a'], [30, '#d97f3f'], [36, '#c2532f']
    ];
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 0; i < stops.length - 1; i++){
      const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
      if (t <= t1){
        const k = (t - t0) / (t1 - t0);
        return lerpColor(c0, c1, k);
      }
    }
    return stops[stops.length - 1][1];
  }
};
function lerpColor(a, b, k){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const m = (x, y) => Math.round(x + (y - x) * clamp(k, 0, 1));
  return 'rgb(' + m(r1, r2) + ',' + m(g1, g2) + ',' + m(b1, b2) + ')';
}

/** 天气动态背景 —— 纯 Canvas，按天气绘制雨/雪/云/星 */
const WxCanvas = (() => {
  let raf = null, ctx = null, W = 0, H = 0, dpr = 1, parts = [], key = 'cloud', t0 = 0;
  function fit(cv){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed(k){
    parts = [];
    const n = k === 'rain' || k === 'storm' ? 90 : k === 'snow' ? 60 : k === 'fog' ? 6 : 26;
    for (let i = 0; i < n; i++){
      parts.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.9 + .55,
        v: Math.random() * .55 + .28,
        d: Math.random() * .5 + .18,
        a: Math.random() * .34 + .1,
        l: Math.random() * 18 + 8,
        ph: Math.random() * Math.PI * 2
      });
    }
  }
  function frame(now){
    if (!ctx) return;
    const el = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    const dark = document.documentElement.dataset.theme === 'dark';
    const mul = dark ? 1.5 : 1;
    if (key === 'rain' || key === 'storm'){
      ctx.strokeStyle = dark ? 'rgba(138,180,202,.42)' : 'rgba(74,113,137,.30)';
      ctx.lineWidth = 1.15; ctx.lineCap = 'round';
      parts.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.l * .22, p.y + p.l);
        ctx.stroke();
        p.y += p.v * 8; p.x -= p.v * 1.7;
        if (p.y > H + 24){ p.y = -24; p.x = Math.random() * (W + 90); }
      });
    } else if (key === 'snow'){
      ctx.fillStyle = dark ? 'rgba(233,240,245,.55)' : 'rgba(125,151,171,.42)';
      parts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(el * .8 + p.ph) * 9, p.y, p.r, 0, 6.2832);
        ctx.fill();
        p.y += p.v * 1.5;
        if (p.y > H + 8){ p.y = -8; p.x = Math.random() * W; }
      });
    } else if (key === 'sun' || key === 'partly' || key === 'moon'){
      const cx = W * .82, cy = H * .18;
      const col = key === 'moon' ? '107,118,153' : '217,150,47';
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * .72);
      g.addColorStop(0, 'rgba(' + col + ',' + (dark ? .26 : .21) + ')');
      g.addColorStop(.45, 'rgba(' + col + ',' + (dark ? .09 : .07) + ')');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 缓慢漂浮的柔光点
      ctx.fillStyle = 'rgba(255,255,255,' + (dark ? .1 : .34) + ')';
      parts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(el * .25 + p.ph) * 14, p.y + Math.cos(el * .18 + p.ph) * 10, p.r * .9, 0, 6.2832);
        ctx.fill();
      });
    } else if (key === 'fog'){
      ctx.fillStyle = dark ? 'rgba(145,138,128,.11)' : 'rgba(160,152,138,.15)';
      for (let i = 0; i < 5; i++){
        const y = H * (i / 5) + Math.sin(el * .3 + i) * 7;
        ctx.beginPath();
        ctx.ellipse(W * .5 + Math.sin(el * .16 + i * 1.7) * W * .28, y, W * .55, H * .075, 0, 0, 6.2832);
        ctx.fill();
      }
    } else {
      // cloud / 默认
      ctx.fillStyle = dark ? 'rgba(150,158,168,.09)' : 'rgba(138,144,153,.13)';
      parts.forEach(p => {
        const x = p.x + Math.sin(el * .14 + p.ph) * 28;
        ctx.beginPath();
        ctx.ellipse(x, p.y, p.r * 26 * mul, p.r * 11, 0, 0, 6.2832);
        ctx.fill();
      });
    }
    raf = requestAnimationFrame(frame);
  }
  return {
    start(cv, k){
      this.stop();
      if (!cv) return;
      fit(cv); key = k; seed(k); t0 = performance.now();
      if (matchMedia('(prefers-reduced-motion:reduce)').matches){ frame(performance.now()); cancelAnimationFrame(raf); raf = null; return; }
      raf = requestAnimationFrame(frame);
    },
    stop(){ if (raf) cancelAnimationFrame(raf); raf = null; ctx = null; },
    resize(cv){ if (cv && ctx){ fit(cv); seed(key); } }
  };
})();

/* ==========================================================================
   5. AI 供应商 / 余额查询
   --------------------------------------------------------------------------
   各厂商余额接口并不统一，这里按 kind 分发到对应适配器。
   自定义项走「OpenAI 兼容」通用探测：依次尝试常见余额端点。
   ========================================================================== */
const AI = {
  /** 预置厂商档案 */
  PROFILES: {
    deepseek: { name: 'DeepSeek', base: 'https://api.deepseek.com', color: '#4d6bfe', letter: 'D',
      keys: 'https://platform.deepseek.com/api_keys',
      models: ['deepseek-chat', 'deepseek-reasoner'] },
    mimo: { name: 'Xiaomi MiMo', base: 'https://api.xiaomimimo.com/v1', color: '#ff6900', letter: 'M',
      keys: 'https://platform.xiaomimimo.com/#/console/api-keys',
      models: ['mimo-v2.6-pro', 'mimo-v2.6-flash', 'mimo-v2.6-pro-ultraspeed'] },
    moonshot: { name: 'Moonshot', base: 'https://api.moonshot.cn/v1', color: '#12b7a8', letter: 'K',
      keys: 'https://platform.moonshot.cn/console/api-keys',
      models: ['kimi-k3', 'kimi-k2.6', 'kimi-k2.5', 'moonshot-v1-32k'] },
    custom: { name: '自定义', base: '', color: '#7a5c78', letter: 'C', keys: '', models: [] }
  },

  get all(){ return Store.db.providers; },
  get(id){ return Store.db.providers.find(p => p.id === id); },

  /** 当前默认供应商（v1.16）—— 所有「只需要一个 AI」的功能都走这里。
   *
   *  三级回退，保证任何历史数据状态下都能拿到一个合理结果：
   *    ① 用户显式选的默认项（且必须填了 Key，否则等于没配）
   *    ② 第一个填了 Key 的供应商（老用户没选过默认时的兜底，行为与升级前一致）
   *    ③ null —— 调用方据此渲染「去配置」引导，而不是抛错
   *
   *  为什么不让调用方各自 find(p => p.key)：那样每处都要重复写回退逻辑，
   *  迟早有一处写漏；而且用户在设置里选了默认，某些页面却不认，体验上很割裂。
   */
  pickDefault(){
    const list = this.all || [];
    const wantId = Store.db?.settings?.defaultAI;
    const want = wantId ? list.find(p => p.id === wantId) : null;
    if (want && want.key) return want;
    return list.find(p => p.key) || null;
  },

  /** 默认供应商的展示名，用于「AI 查值」等按钮旁的提示文案 */
  defaultName(){
    const p = this.pickDefault();
    return p ? p.name : '';
  },

  /** 结构化错误提示 */
  friendly(e, p){
    const s = e.status;
    // 适配器已经给出明确、可读的结论时（如「该厂商未开放余额接口」），直接采用，
    // 不要再降级成「接口地址不存在」这类会误导用户的通用文案。
    if (e.mimoModels || /未开放余额查询/.test(e.message || '')) return e.message;
    if (e.name === 'AbortError') return '请求超时，检查网络或代理';
    if (s === 401) return 'Key 无效或已失效（401）';
    if (s === 403) return 'Key 无权限访问该接口（403）';
    if (s === 404) return '接口地址不存在（404），请核对 Base URL';
    if (s === 429) return '请求过于频繁，稍后再试（429）';
    if (s >= 500) return '服务端异常（' + s + '），稍后重试';
    if (s) return 'HTTP ' + s + (e.message ? '：' + e.message : '');
    if (/Failed to fetch|NetworkError|load failed/i.test(e.message)) return '网络不可达：跨域被拦截或无法连接该域名';
    return e.message || '未知错误';
  },

  /** 查询单个供应商余额 */
  async fetchBalance(p){
    if (!p.key) return { ok: false, err: '尚未填写 API Key' };
    const H = { 'Authorization': 'Bearer ' + p.key, 'Content-Type': 'application/json' };
    try {
      let out = null;
      if (p.kind === 'deepseek')       out = await this._deepseek(p, H);
      else if (p.kind === 'moonshot')  out = await this._moonshot(p, H);
      else if (p.kind === 'mimo')      out = await this._mimo(p, H);
      else                             out = await this._generic(p, H);
      return out;
    } catch (e){
      return { ok: false, err: this.friendly(e, p), consoleUrl: e.console || '' };
    }
  },

  /** DeepSeek: GET /user/balance */
  async _deepseek(p, H){
    const d = await jjson(p.base.replace(/\/$/, '') + '/user/balance', { headers: H }, 12000);
    if (!d.is_available && d.balance_infos?.length === 0) throw new Error('账户不可用');
    const info = (d.balance_infos || [])[0] || {};
    const total = parseFloat(info.total_balance ?? '0');
    return { ok: true, amount: total, currency: info.currency || 'CNY',
      granted: parseFloat(info.granted_balance ?? '0'), topped: parseFloat(info.topped_up_balance ?? '0'),
      available: d.is_available !== false, raw: d };
  },

  /** Moonshot: GET /users/me/balance */
  async _moonshot(p, H){
    const d = await jjson(p.base.replace(/\/$/, '') + '/users/me/balance', { headers: H }, 12000);
    const info = d.data || d;
    const amt = Number(info.available_balance ?? info.balance ?? 0);
    return { ok: true, amount: amt, currency: 'CNY',
      voucher: Number(info.voucher_balance ?? 0), cash: Number(info.cash_balance ?? 0), raw: d };
  },

  /**
   * 小米 MiMo
   * 官方文档（mimo.mi.com/docs）只提供 OpenAI 兼容的 /chat/completions，
   * 并未开放任何余额查询接口（实测 /user/balance、/balance、/users/me/balance、
   * /dashboard/billing/credit_grants 均返回 404）。
   * 因此这里不去盲试不存在的端点，改为用 GET /models 验证 Key 有效性，
   * 并明确告知用户去官方控制台查看用量。
   */
  async _mimo(p, H){
    const base = (p.base || '').replace(/\/$/, '');
    if (!base) throw new Error('未填写 Base URL');
    // 用 /models 做连通性与鉴权校验（401/403 会在此抛出并被 friendly() 转成可读提示）
    const d = await jjson(base + '/models', { headers: H }, 12000);
    const list = (d.data || d.models || []).map(m => m.id || m.name).filter(Boolean);
    const err = new Error('MiMo 未开放余额查询接口，请到官方控制台查看用量');
    err.status = 404;
    err.mimoModels = list;
    err.console = 'https://platform.xiaomimimo.com/#/console/usage';
    throw err;
  },

  /** 自定义 OpenAI 兼容：尝试一组常见余额端点 + /models 连通性探测 */
  async _generic(p, H){
    const base = (p.base || '').replace(/\/$/, '');
    if (!base) throw new Error('未填写 Base URL');
    const eps = ['/dashboard/billing/credit_grants', '/user/balance', '/balance', '/users/me/balance', '/credits'];
    let last = null;
    for (const ep of eps){
      try {
        const d = await jjson(base + ep, { headers: H }, 10000);
        const info = d.data || d;
        const amt = this._digAmount(info);
        if (amt !== null) return { ok: true, amount: amt, currency: info.currency || (info.total_granted !== undefined ? 'USD' : 'CNY'), raw: d, ep: base + ep };
      } catch (e){
        last = e;
        if (e.status === 401 || e.status === 403) throw e; // 鉴权错直接上报
      }
    }
    // 兜底：确认 key 可用，但余额端点确实没有
    try {
      await jjson(base + '/models', { headers: H }, 10000);
      const err = new Error('Key 有效，但该服务未开放余额查询接口，请在厂商后台查看');
      err.status = 404; throw err;
    } catch (e){
      if (e.status === 404 && /余额/.test(e.message)) throw e;
      throw last || e;
    }
  },

  /** 从任意结构里挖出金额字段 */
  _digAmount(o, depth = 0){
    if (!o || depth > 3) return null;
    const keys = ['total_available', 'total_balance', 'available_balance', 'balance', 'remaining',
                  'credit', 'credits', 'total_granted', 'amount', 'quota'];
    for (const k of keys){
      for (const obj of [o, o.data, o.result, o.balance, o.account]){
        if (obj && typeof obj === 'object' && obj[k] !== undefined){
          const v = Number(typeof obj[k] === 'object' ? (obj[k].amount ?? obj[k].total ?? NaN) : obj[k]);
          if (!isNaN(v)) return v;
        }
      }
    }
    for (const k of Object.keys(o)){
      if (o[k] && typeof o[k] === 'object'){
        const r = this._digAmount(o[k], depth + 1);
        if (r !== null) return r;
      }
    }
    return null;
  },

  /** 批量刷新 */
  async refreshAll(ids){
    const list = ids ? this.all.filter(p => ids.includes(p.id)) : this.all;
    if (!list.length) return;
    Bal.working = list.map(p => p.id);
    Bal.render();
    // finally 兜底：任何一步抛错（渲染异常、fetchBalance 之外的意外）都要把
    // working 清空并重绘，否则卡片会永远卡在「查询中…」的假象上。
    try {
      await Promise.all(list.map(async p => {
        const r = await this.fetchBalance(p);
        Store.db.providers = Store.db.providers.map(x => x.id === p.id
          ? { ...x, bal: r.ok ? r.amount : null, balAt: r.ok ? Date.now() : x.balAt,
              balErr: r.ok ? '' : r.err, balMeta: r.ok ? r : null,
              consoleUrl: r.ok ? '' : (r.consoleUrl || '') }
          : x);
      }));
      Store.save();
    } finally {
      Bal.working = [];
      Bal.render();
    }
    const okN = list.filter(p => p.bal !== null && !p.balErr).length;
    toast(okN ? 'ok' : 'warn', '余额刷新完成', okN + ' / ' + list.length + ' 个供应商查询成功', 3800);
  },

  /**
   * 部分模型的采样参数被厂商锁死，传别的值会直接 400。
   * 依据 Moonshot 官方说明（platform.kimi.com/docs/guide/benchmark-best-practice）：
   *   kimi-k2.5 / k2.6 / k2-thinking* / k3  → temperature 只能为 1.0
   *   kimi-k2-0711 / k2-0905 / k2-turbo     → 推荐 0.6
   *   moonshot-v1-*                         → 接受任意值（0~2）
   * 命中锁定的模型返回锁定值，其余沿用调用方传入的默认值。
   */
  tempFor(model, wanted){
    const m = String(model || '').toLowerCase().trim();
    // K2.5+ / K3 / thinking 系列：参数被锁死为 1
    if (/^kimi-k(3|2\.[5-9])\b/.test(m) || /^kimi-k2-thinking/.test(m)) return 1;
    // K2 早期版本：官方推荐 0.6
    if (/^kimi-k2-(0[0-9]{3}|turbo)/.test(m)) return 0.6;
    return wanted;
  },

  /** 供新闻总结调用：用指定供应商发一次 chat 请求 */
  async chat(providerId, messages, { maxTokens = 1400, temperature = 0.4, timeout = 70000 } = {}){
    const p = this.get(providerId);
    if (!p) throw new Error('供应商不存在');
    if (!p.key) throw new Error(p.name + ' 尚未填写 API Key');
    const base = (p.base || '').replace(/\/$/, '');
    const model = (p.models && p.models[0]) || 'gpt-4o-mini';
    const url = /\/v\d+$/.test(base) || /\/(chat\/)?completions$/.test(base)
      ? (/completions$/.test(base) ? base : base + '/chat/completions')
      : base + '/chat/completions';

    const call = async (t) => {
      const body = { model, messages, temperature: t, max_tokens: maxTokens, stream: false };
      return await jjson(url, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + p.key, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }, timeout);
    };

    let d;
    try {
      d = await call(this.tempFor(model, temperature));
    } catch (e){
      // 兜底：厂商锁定采样参数时会回 "invalid temperature: only N is allowed"，
      // 从报错里读出它要求的数值再试一次，避免以后新增模型又要改代码。
      const m = /invalid temperature[^0-9]*([0-9]*\.?[0-9]+)/i.exec(e.message || '');
      if (e.status === 400 && m){
        d = await call(Number(m[1]));
      } else {
        throw e;
      }
    }
    const c = d?.choices?.[0]?.message?.content;
    if (!c) throw new Error('模型未返回内容' + (d?.error?.message ? '：' + d.error.message : ''));
    return { text: c, model: d.model || model, usage: d.usage || null };
  },

  /** 探测可用模型（部分厂商支持 /models） */
  async listModels(p){
    const base = (p.base || '').replace(/\/$/, '');
    if (!base || !p.key) return null;
    try {
      const d = await jjson(base + '/models', { headers: { 'Authorization': 'Bearer ' + p.key } }, 10000);
      const arr = d.data || d.models || [];
      const ids = arr.map(m => (typeof m === 'string' ? m : m.id)).filter(Boolean);
      return ids.length ? ids : null;
    } catch (e){ return null; }
  },

  /** 让模型估算一杯饮品的糖分（官网不公开的字段）。
   *  热量与咖啡因优先用内置官方表，这里主要补糖分，顺便给一份兜底三件套。
   *
   *  为什么让模型只回 JSON：自然语言没法抄进输入框。
   *  prompt 里把「只回 JSON、不要解释、数字不带单位」写死，并做严格解析，
   *  解析失败就抛出——由调用方降级成「只填官网值，糖分留空」，不猜。 */
  async estimateDrink(providerId, { name, volume, official }){
    const sys = '你是一位饮品营养数据助手。只输出一个 JSON 对象，不要任何解释文字、不要 markdown 代码块、不要单位。';
    const known = official && (official.k != null || official.c != null)
      ? '已知该饮品的官方数据：' +
        (official.k != null ? '热量 ' + official.k + ' kcal；' : '') +
        (official.c != null ? '咖啡因 ' + official.c + ' mg；' : '') +
        '规格为「' + (official.d || '官方默认配置') + '」。这些已知值请原样返回，不要修改。'
      : '没有官方数据，请按你的知识估算。';

    const ask = '饮品名称：' + name + '（容量约 ' + volume + 'ml）\n' + known +
      '\n请返回 JSON，字段：\n' +
      '{"kcal":热量千卡整数,"caffeine":咖啡因毫克整数,"sugar":添加糖克整数,"confidence":"high|medium|low","basis":"依据简述20字内"}\n' +
      '要求：三个数值都必须是不带单位的纯数字；不确定的字段给最接近的整数，不要写 null；' +
      'sugar 指添加糖（不含牛奶等天然存在的乳糖）；confidence 表示你对估算的把握。';

    const r = await this.chat(providerId, [
      { role: 'system', content: sys },
      { role: 'user', content: ask }
    ], { maxTokens: 400, temperature: 0.2, timeout: 45000 });

    // 严格解析：剥掉可能包裹的 ``` 与前后杂字，取第一个 {...}
    let txt = String(r.text || '').trim();
    txt = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const m = txt.match(/\{[\s\S]*?\}/);
    if (!m) throw new Error('模型没有返回可解析的 JSON');

    let o;
    try { o = JSON.parse(m[0]); }
    catch (e){ throw new Error('模型返回的 JSON 格式不正确'); }

    const n = (v, max) => {
      const x = Number(String(v).replace(/[^0-9.\-]/g, ''));
      return isFinite(x) && x >= 0 ? Math.min(Math.round(x), max) : null;
    };
    const out = {
      kcal: n(o.kcal, 3000),
      caffeine: n(o.caffeine, 2000),
      sugar: n(o.sugar, 500),
      confidence: ['high', 'medium', 'low'].includes(o.confidence) ? o.confidence : 'medium',
      basis: String(o.basis || '').slice(0, 40),
      model: r.model
    };
    if (out.kcal === null && out.caffeine === null && out.sugar === null){
      throw new Error('模型返回的数值都不可用');
    }
    return out;
  }
};

  { id:'weibo',   name:'微博热搜',  tag:'综合', icon:'fire', api:'/v2/weibo',   kind:'ov' },
  { id:'zhihu',   name:'知乎热榜',  tag:'综合', icon:'fire', api:'/v2/zhihu',   kind:'ov' },

  { id:'douyin',  name:'抖音热点',  tag:'短视频', icon:'fire', api:'/v2/douyin', kind:'ov' },
  { id:'quark',   name:'夸克热点',  tag:'综合', icon:'spark',api:'/v2/quark',   kind:'ov' },
  { id:'itnews',  name:'IT 之家',   tag:'科技', icon:'book', api:'/v2/it-news', sort:'rank', kind:'ov' },
  { id:'ainews',  name:'AI 快讯',   tag:'AI',   icon:'spark',api:'/v2/ai-news', kind:'ov' },

/** 60s API 公共实例（主站优先，失败自动切换） */
const NEWS_HOSTS = [
  'https://60s-api.viki.moe',
  'https://60s.crystelf.top',
  'https://api.elysiayanyu.top',
  'https://60s.7se.cn'
];

const News = {
  items: [],
  loading: false,
  err: '',
  active: '',      // 当前聚焦来源
  summaries: {},   // providerId -> {text, at}
  summarizing: false,
  summarizeErr: '',

  get enabled(){ return new Set(Store.db.settings.newsSources || []); },

  /** 抓一个来源（多实例自动降级） */
  async fetchOne(src){
    if (!src.api) return [];
    let lastErr = null;
    for (const host of NEWS_HOSTS){
      try {
        const url = host + src.api + (src.sort ? '?sort=' + src.sort : '');
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 11000);
        let d;
        try { d = await (await fetch(url, { signal: ctl.signal })).json(); }
        finally { clearTimeout(timer); }
        const items = this.normalize(d, src);
        if (items.length) return items;
        lastErr = new Error('返回内容为空');
      } catch (e){ lastErr = e; }
    }
    throw lastErr || new Error('全部实例不可用');
  },

  /** 把各家接口结构统一成 {title,url,hot} */
  normalize(d, src){
    const raw = d && (d.data !== undefined ? d.data : d);
    const out = [];
    const push = (title, link, hot) => {
      const t = this._clean(title);
      if (!t || t.length < 4) return;
      out.push({
        id: uid(), title: t, url: safeUrl(link) || '',
        src: src.id, srcName: src.name, hot: Number(hot) || 0, rank: out.length + 1
      });
    };
    if (Array.isArray(raw)){
      raw.forEach(x => {
        if (!x || typeof x !== 'object') return;
        if (src.id === 'history'){
          // 历史事件：标题 + 年份
          push((x.year ? x.year + ' 年 · ' : '') + (x.title || ''), x.link, 0);
          return;
        }
        const title = x.title || x.name || x.word || x.query || x.Title || '';
        const link  = x.link || x.url || x.Link || x.Url || x.mobileUrl || '';
        const hot   = x.hot_value ?? x.hotValue ?? x.hot ?? x.hot_score ?? x.score ?? x.HotValue ?? x.views ?? 0;
        push(title, link, hot);
      });
    } else if (raw && typeof raw === 'object'){
      // 有的接口把列表放在子字段里
      for (const v of Object.values(raw)){
        if (Array.isArray(v) && v.length && typeof v[0] === 'object'){
          v.forEach(x => push(x.title || x.name || '', x.link || x.url || '', x.hot_value ?? x.hot ?? 0));
          break;
        }
      }
    }
    return out.slice(0, 40).map((x, i) => ({ ...x, rank: i + 1 }));
  },

  /** 清洗标题 */
  _clean(t){
    return String(t == null ? '' : t)
      .replace(/<[^>]*>/g, ' ')
      .replace(/&quot;/g, '"').replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },

  /** 兜底：从任意 HTML 抽取标题（旧式网页来源仍可用） */
  parseHtml(html, src){
    const out = [], seen = new Set();
    const re = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]{2,220}?)<\/a>/gi;
    let m, guard = 0;
    while ((m = re.exec(html)) && guard++ < 2500){
      let txt = m[2].replace(/<[^>]+>/g, ' ').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
      txt = this._clean(txt);
      if (!txt || txt.length < 6 || txt.length > 150) continue;
      if (/^(登录|注册|首页|更多|下载|客户端|广告|关于我们|隐私|条款)$/.test(txt)) continue;
      const k = txt.toLowerCase();
      if (seen.has(k)) continue;
      seen.add(k);
      let href = m[1];
      try {
        if (/^\/\//.test(href)) href = 'https:' + href;
        else if (/^\//.test(href)) href = new URL(src.url).origin + href;
        else if (!/^https?:/i.test(href)) href = new URL(href, src.url).href;
      } catch (e){ href = ''; }
      out.push({ id: uid(), title: txt, url: safeUrl(href) || '', src: src.id, srcName: src.name, hot: 0, rank: out.length + 1 });
    }
    return out.slice(0, 30);
  },

  /** 抓取所有已启用来源 */
  async fetchAll(){
    if (this.loading) return;
    const srcs = NEWS_SOURCES.filter(s => this.enabled.has(s.id) && s.id !== 'ssr');
    if (!srcs.length){ toast('warn', '没有选中任何来源', '在左侧列表里挑几个想看的。'); return; }
    this.loading = true; this.err = ''; this.render();
    const results = await Promise.allSettled(srcs.map(s => this.fetchOne(s)));
    const all = []; const failed = [];
    results.forEach((r, i) => {
      if (r.status === 'fulfilled' && r.value.length){ all.push(...r.value); }
      else failed.push(srcs[i].name);
    });
    // 交错合并，避免同一来源扎堆
    const bySrc = {};
    all.forEach(x => { (bySrc[x.src] = bySrc[x.src] || []).push(x); });
    const order = Object.keys(bySrc);
    const merged = [];
    for (let round = 0; merged.length < all.length && round < 40; round++){
      order.forEach(k => { const it = bySrc[k][round]; if (it) merged.push(it); });
    }
    this.items = merged.map((x, i) => ({ ...x, rank: i + 1 }));
    this.loading = false;
    if (!this.items.length){
      this.err = failed.length ? ('以下来源抓取失败：' + failed.join('、')) : '没有抓到内容，稍后再试。';
    }
    Store.db.settings.lastNews = { items: this.items.slice(0, 80), at: Date.now(), failed };
    Store.save();
    this.render();
    if (this.items.length) toast('ok', '热榜已更新', '共 ' + this.items.length + ' 条，来自 ' + Object.keys(bySrc).length + ' 个来源', 3200);
    else toast('err', '抓取失败', this.err, 6000);
  },

  /** 重绘当前新闻视图（保持滚动位置） */
  render(){
    if (CUR !== 'news') return;
    const y = window.scrollY;
    renderNews();
    window.scrollTo(0, y);
  },

  /** AI 总结 —— 使用选定供应商 */
  async summarize(providerId){
    const p = AI.get(providerId);
    if (!p){ toast('err', '供应商不存在'); return; }
    if (!p.key){
      toast('warn', p.name + ' 缺少 API Key', '先在「AI 余额」里填好 Key，再回来总结。', 6000, [
        { text: '去填写', fn: () => Bal.openEditor(p.id) }
      ]);
      return;
    }
    if (!this.items.length){ toast('warn', '还没有热榜内容', '先刷新一次热榜。'); return; }
    this.summarizing = true; this.summarizeErr = ''; this.render();

    const list = this.items.slice(0, 45).map((x, i) =>
      (i + 1) + '. [' + x.srcName + '] ' + x.title).join('\n');

    const sys = '你是一位资讯编辑。请只依据用户给出的热榜标题进行归纳，不要编造未出现的事实、数字或链接。输出使用简体中文，Markdown 格式，结构如下（不要添加其他标题层级）：\n' +
      '## 一句话概览\n（40字以内概括当下舆论重心）\n' +
      '## 正在发生\n（4到6条要点，每条以「- 」开头，说明是什么事、为何受关注）\n' +
      '## 值得留意\n（2到3条更深一层的观察或趋势判断）\n' +
      '## 生活提示\n（1到2条与普通人日常生活相关的实用提示，例如出行、消费、天气相关注意事项）';

    const usr = '今日热榜（共 ' + this.items.length + ' 条，以下为节选）：\n\n' + list + '\n\n请按要求归纳。';

    try {
      const r = await AI.chat(providerId, [
        { role: 'system', content: sys },
        { role: 'user', content: usr }
      ], { maxTokens: 1500, temperature: 0.35 });
      this.summaries[providerId] = { text: r.text, at: Date.now(), model: r.model, usage: r.usage };
      toast('ok', p.name + ' 总结完成', '模型：' + r.model, 3200);
    } catch (e){
      this.summarizeErr = AI.friendly(e, p);
      toast('err', p.name + ' 总结失败', this.summarizeErr, 7000);
    }
    this.summarizing = false;
    this.render();
  },

  /** 多 AI 并行总结并做交叉对照 */
  async summarizeMulti(ids){
    const list = ids.filter(id => (AI.get(id)?.key));
    if (!list.length){ toast('warn', '没有可用的 AI', '至少给一个供应商填上 API Key。'); return; }
    this.summarizing = true; this.summarizeErr = ''; this.render();
    const res = await Promise.allSettled(list.map(id => this.summarize(id)));
    this.summarizing = false;
    this.compareMode = list.length > 1;
    this.render();
    const ok = list.filter(id => this.summaries[id]).length;
    toast(ok ? 'ok' : 'err', '多模型汇总完成', ok + ' / ' + list.length + ' 个模型返回了结果', 4000);
  },

  /** 极简 Markdown → HTML（只支持总结所需的子集，全程转义） */
  md(src){
    const lines = String(src || '').split(/\r?\n/);
    let html = '', inUl = false, inOl = false;
    const inline = s => esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="font-family:var(--f-num);font-size:12.5px;background:var(--surface-3);padding:1px 4px;border-radius:4px">$1</code>');
    const closeLists = () => {
      if (inUl){ html += '</ul>'; inUl = false; }
      if (inOl){ html += '</ol>'; inOl = false; }
    };
    for (let raw of lines){
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()){ closeLists(); continue; }
      let m;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))){ closeLists(); html += '<h4>' + inline(m[1]) + '</h4>'; continue; }
      if ((m = line.match(/^\s*[-*+]\s+(.*)$/))){
        if (!inUl){ closeLists(); html += '<ul>'; inUl = true; }
        html += '<li>' + inline(m[1]) + '</li>'; continue;
      }
      if ((m = line.match(/^\s*\d+[.、)]\s+(.*)$/))){
        if (!inOl){ closeLists(); html += '<ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">'; inOl = true; }
        html += '<li style="list-style:decimal">' + inline(m[1]) + '</li>'; continue;
      }
      closeLists();
      html += '<p>' + inline(line) + '</p>';
    }
    closeLists();
    return html || '<p class="muted">（内容为空）</p>';
  }
};

/* ------------------------------ 天气视图 ------------------------------ */
async function renderWeather(){
  const box = $('#view');
  const st = Store.db.settings;
  const city = st.city;
  box.innerHTML =
    '<div id="wxHost"><div class="card" style="padding:40px;text-align:center">' +
      '<div class="skeleton" style="height:14px;width:120px;margin:0 auto 12px"></div>' +
      '<div class="skeleton" style="height:64px;width:200px;margin:0 auto 16px"></div>' +
      '<div class="skeleton" style="height:10px;width:260px;margin:0 auto"></div>' +
      '<p class="muted tiny" style="margin-top:18px">正在获取 ' + esc(city.name) + ' 的天气…</p>' +
    '</div></div>' +
    '<div class="grid g-3" style="margin-top:18px" id="wxExtra"></div>';

  let d = null;
  try {
    d = await Weather.fetch(city);
    Weather.data = d;
    Store.db.settings.lastWeather = { data: d, at: Date.now() };
    Store.save();
  } catch (e){
    d = st.lastWeather?.data || null;
    Weather.err = e.message;
  }

  // ── 异步回来后做「视图存活」校验 ──
  // 请求期间用户可能已切到别的页面，此时 #view 已被其它渲染函数重写，
  // 继续往下写会命中 null。仅在当前仍是天气页且宿主节点还在时才继续。
  if (CUR !== 'weather' || !$('#wxHost')) return;

  if (!d){
    $('#wxHost').innerHTML =
      '<div class="empty">' + ic('cloud') +
      '<p>天气暂时拿不到</p><small>' + esc(Weather.err || '网络异常') + '<br>可以换一个城市试试，或稍后刷新。</small>' +
      '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn btn--sm" id="wxRetry">' + ic('refresh') + '重试</button>' +
      '<button class="btn btn--sm" id="wxPick2">' + ic('loc') + '选择城市</button></div></div>';
    $('#wxRetry').onclick = () => renderWeather();
    $('#wxPick2').onclick = () => openCityPicker();
    return;
  }
  drawWeatherMain(d);
  renderWeatherExtra(d);
}

function drawWeatherMain(d){
  const m = wxMeta(d.code, isDayNow(d), d.desc);
  // 统一走一层中文兜底：老缓存里可能还存着英文 desc（数据层已修，但缓存 15 分钟内不会重取）
  const dDesc = wxText(d.code, d.desc);
  const dRegion = regionText(d.region);   // 地区名同样兜底，老缓存可能存着英文
  const host = $('#wxHost');
  if (!host) return;                       // 宿主已不存在（视图已切换），安全退出
  const tc = Weather.tempColor(d.temp);
  const today = d.days?.[0] || {};
  const stale = Date.now() - (d.at || 0) > 40 * 60 * 1000;

  host.innerHTML =
    '<div class="wx" style="background:linear-gradient(170deg,' + m.tone.bg + ',' + 'var(--surface)' + ' 78%)">' +
      '<canvas class="wx__canvas" id="wxCv"></canvas>' +
      '<div class="wx__inner">' +
        '<div class="wx__top">' +
          '<div>' +
            '<div class="wx__place">' + ic('loc') + '<span>' + esc(String(d.place || Store.db.settings.city.name).split(/\s*·\s*/)[0]) + '</span>' +
              (dRegion ? '<span class="muted tiny" style="font-weight:400">· ' + esc(dRegion) + '</span>' : '') +
              '<button id="wxPick" title="切换城市" aria-label="切换城市">' + ic('chev') + '</button>' +
            '</div>' +
            '<div class="tiny muted" style="margin-top:3px;padding-left:22px">' +
              esc(fmtDay(new Date())) + ' ' + esc(WEEK[new Date().getDay()]) + ' · ' +
              (stale ? '数据可能已过期' : '更新于 ' + esc(fmtTime(d.at || Date.now()))) +
              ' · 来源 ' + esc(d.src || '') +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            (dDesc ? '<span class="tag' + (/雨|雪|雷/.test(dDesc) ? ' tag--sky' : /晴/.test(dDesc) ? ' tag--amber' : '') + '">' + esc(dDesc) + '</span>' : '') +
            (today.max != null ? '<span class="tag">' + esc(Math.round(today.min)) + '° ~ ' + esc(Math.round(today.max)) + '°</span>' : '') +
            '<button class="btn btn--sm btn--icon" id="wxRefresh" title="刷新天气">' + ic('refresh') + '</button>' +
          '</div>' +
        '</div>' +

        '<div class="wx__main">' +
          '<div class="wx__icon">' + wxIconBig(m.key, 88) + '</div>' +
          '<div>' +
            '<div class="wx__temp" style="color:' + tc + '">' + esc(Math.round(d.temp)) + '<sup>°C</sup></div>' +
            '<div class="wx__desc" style="margin-top:8px">' + esc(dDesc || '—') + '</div>' +
            '<div class="wx__feels">体感 ' + esc(Math.round(d.feels ?? d.temp)) + '°C' +
              (d.precip > 0 ? ' · 降水 ' + esc(d.precip) + 'mm' : '') + '</div>' +
          '</div>' +
          '<div class="wx__meta">' +
            stat('湿度', (d.humidity != null ? d.humidity + '%' : '—')) +
            stat('风力', (d.windK != null ? Math.round(d.windK) + ' km/h' : '—') + (d.windDir ? ' ' + esc(d.windDir) : '')) +
            stat('气压', (d.pressure != null ? Math.round(d.pressure) + ' hPa' : '—')) +
            stat('能见度', (d.vis != null ? Number(d.vis).toFixed(1) + ' km' : '—')) +
            stat('紫外线', (d.uv != null ? 'UV ' + d.uv : '—')) +
            stat('日出/日落', (d.sunrise || '—') + ' / ' + (d.sunset || '—')) +
          '</div>' +
        '</div>' +

        (d.hours?.length ?
        '<div class="wx__hours">' + d.hours.slice(0, 12).map((h, i) => {
          const hDesc = wxText(h.code, h.desc);
          const hm = wxMeta(h.code, h.h >= 6 && h.h < 19, h.desc);
          return '<div class="wx__hr' + (i === 0 ? ' is-now' : '') + '" title="' + escAttr(hDesc) + '">' +
            '<time>' + (i === 0 ? '现在' : esc(pad2(h.h) + ':00')) + '</time>' +
            wxIconSmall(hm.key) + '<b>' + esc(Math.round(h.t)) + '°</b></div>';
        }).join('') + '</div>' : '') +

        (d.days?.length > 1 ?
        '<div class="wx__days">' + d.days.slice(0, 5).map((x, i) => {
          const xDesc = wxText(x.code, x.desc);
          const dm = wxMeta(x.code, true, x.desc);
          const dt = i === 0 ? '今天' : WEEK[new Date(x.date).getDay()];
          return '<div class="wx__day" title="' + escAttr(xDesc) + '">' +
            '<span>' + esc(dt) + '</span>' + wxIconSmall(dm.key) +
            '<b>' + esc(Math.round(x.max)) + '° <i style="color:var(--ink-4);font-style:normal">' + esc(Math.round(x.min)) + '°</i></b>' +
            (xDesc ? '<i style="display:block;margin-top:2px">' + esc(xDesc.slice(0, 6)) + '</i>' : '') +
            '</div>';
        }).join('') + '</div>' : '') +

        commuteBlock(d) +

        '<div class="wx__advice">' + ic('spark') + ' ' + esc(Weather.advice(d)) + '</div>' +
      '</div>' +
    '</div>';

  $('#wxPick').onclick = () => openCityPicker();
  $('#wxRefresh').onclick = () => {
    try { localStorage.removeItem('lifehub.v1.wx.' + Store.db.settings.city.lat.toFixed(2) + '.' + Store.db.settings.city.lon.toFixed(2)); } catch(e){}
    renderWeather();
    toast('ok', '正在刷新天气');
  };
  WxCanvas.start($('#wxCv'), m.key);
  const cEdit = $('#wxComute'); if (cEdit) cEdit.onclick = openCommuteSettings;

  function stat(label, val){
    return '<div class="wx__stat"><span>' + esc(label) + '</span><b class="num">' + val + '</b></div>';
  }
}

/**
 * 通勤天气块 —— 展示上班、下班两个时刻的天气与提醒。
 * 仅在设置里开启时渲染；未开启时给一行轻量入口，不占地方。
 *
 * 日期切换规则：一旦当前时间过了「下班时间」，今天这两段通勤都已经过去了，
 * 再看今天的没有意义 —— 整块切到「明天」，标题上注明「明天」。
 */
function commuteBlock(d){
  const c = Store.db.settings.commute || {};
  if (!c.on){
    return '<div class="cmt cmt--off">' + ic('clock') +
      '<span>想看上下班时的天气？<button class="cmt__lnk" id="wxComute">设置通勤时间</button></span></div>';
  }
  const wd = Array.isArray(c.workdays) ? c.workdays : [1,2,3,4,5];

  // 是否已经过了今天的下班时间 → 决定看今天还是明天
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const homeMin = c.homeH * 60 + c.homeM;
  const isNext = nowMin > homeMin;          // 过了下班点，切到明天
  const off = isNext ? 1 : 0;

  const dayRef = new Date(now);
  dayRef.setDate(dayRef.getDate() + off);
  const dayName = WEEK[dayRef.getDay()];
  const isWork = wd.includes(dayRef.getDay());   // 注意：判断的是「要看的那天」

  const go = Weather.atHour(d, c.goH, c.goM, off);
  const hm = Weather.atHour(d, c.homeH, c.homeM, off);
  const cell = (label, time, x, iconCls) => {
    if (!x) return '<div class="cmt__c"><span class="cmt__lb">' + esc(label) + '</span>' +
      '<b class="cmt__tm">' + esc(time) + '</b><span class="cmt__d">暂无数据</span></div>';
    const xDesc = wxText(x.code, x.desc);   // 通勤块里也过一层，防止缓存旧英文
    const mk = wxMeta(x.code, x.h >= 6 && x.h < 19, x.desc);
    const wet = /雨|雪|雷/.test(xDesc);
    return '<div class="cmt__c' + (wet ? ' is-wet' : '') + '">' +
      '<span class="cmt__lb">' + esc(label) + '<i>' + esc(time) + '</i></span>' +
      '<div class="cmt__m">' + wxIconSmall(mk.key) +
        '<b class="num">' + esc(Math.round(x.t)) + '°</b>' +
        '<span class="cmt__d">' + esc(xDesc.slice(0, 8)) + '</span>' +
      '</div></div>';
  };
  const tips = [];
  const dGo = go ? wxText(go.code, go.desc) : '', dHm = hm ? wxText(hm.code, hm.desc) : '';
  if (/雨|雪|雷/.test(dGo)) tips.push('上班时段有降水，伞别忘');
  if (/雨|雪|雷/.test(dHm)) tips.push('下班时段有降水，记得带伞');
  if (go && go.t <= 8) tips.push('早上偏冷，加件外套');
  if (hm && hm.t >= 30) tips.push('下班时闷热，注意补水');
  if (go && hm && go.t - hm.t >= 10) tips.push('早晚温差大，穿脱方便些');

  return '<div class="cmt">' +
    '<div class="cmt__hd">' +
      '<span class="cmt__tt">' + ic('clock') + '通勤天气' +
        '<span class="cmt__day' + (isNext ? ' is-next' : '') + '">' + (isNext ? '明天' : '今天') + ' ' + dayName + '</span>' +
      '</span>' +
      (isWork ? '' : '<span class="tag tag--sky" style="font-size:10.5px">' + (isNext ? '次日休息' : '今天休息') + '</span>') +
      '<button class="cmt__set" id="wxComute" title="修改通勤时间">' + ic('gear') + '</button>' +
    '</div>' +
    '<div class="cmt__row">' +
      cell('上班', pad2(c.goH) + ':' + pad2(c.goM), go) +
      cell('下班', pad2(c.homeH) + ':' + pad2(c.homeM), hm) +
    '</div>' +
    (isNext ? '<div class="cmt__note">' + ic('info') + '今天的通勤时段已过，这里显示的是明天。</div>' : '') +
    (tips.length ? '<div class="cmt__tip">' + esc(tips.slice(0, 2).join('；')) + '</div>' : '') +
  '</div>';
}

function isDayNow(d){
  if (!d.sunrise || !d.sunset) { const h = new Date().getHours(); return h >= 6 && h < 19; }
  const hm = s => { const [a, b] = String(s).split(':').map(Number); return a * 60 + (b || 0); };
  const now = new Date(); const n = now.getHours() * 60 + now.getMinutes();
  return n >= hm(d.sunrise) && n <= hm(d.sunset);
}

/** 天气页的附加卡片：三日趋势 + 出行建议 + 城市 */
function renderWeatherExtra(d){
  const box = $('#wxExtra');
  if (!box) return;
  const days = (d.days || []).slice(0, 5);
  const all = days.flatMap(x => [Number(x.max), Number(x.min)]);
  const lo = Math.min(...all), hi = Math.max(...all), span = Math.max(1, hi - lo);
  const bars = days.map((x, i) => {
    const h = 100 - ((Number(x.max) - lo) / span) * 70;
    const bh = Math.max(10, ((Number(x.max) - Number(x.min)) / span) * 70 + 12);
    const dm = wxMeta(x.code, true, x.desc);
    return { i, x, h, bh, dm };
  });
  const st = Store.db.settings;
  const hist = (st.cityHistory || []).filter(c => c.name !== st.city.name).slice(0, 6);

  box.innerHTML =
    '<div class="card"><div class="card__hd"><h3>' + ic('barchart') + '气温走势</h3></div>' +
      '<div class="card__bd">' +
      '<svg class="chart" viewBox="0 0 300 130" preserveAspectRatio="none" style="height:130px">' +
        bars.map((b, i) => {
          const x = 16 + i * (268 / Math.max(1, bars.length - 1 || 1)) - 15;
          return '<rect x="' + x + '" y="' + (108 - b.bh) + '" width="30" height="' + b.bh + '" rx="9" fill="' + b.dm.tone.c + '" fill-opacity=".24"/>' +
                 '<rect x="' + x + '" y="' + (108 - b.bh) + '" width="30" height="' + Math.min(b.bh, 5) + '" rx="4" fill="' + b.dm.tone.c + '" fill-opacity=".75"/>' +
                 '<text x="' + (x + 15) + '" y="' + (102 - b.bh) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-weight="600">' + Math.round(b.x.max) + '°</text>' +
                 '<text x="' + (x + 15) + '" y="121" text-anchor="middle" font-size="10" fill="var(--ink-4)">' + (i === 0 ? '今天' : WEEK[new Date(b.x.date).getDay()]) + '</text>';
        }).join('') +
      '</svg>' +
      '<div class="tiny muted" style="margin-top:6px">最低 ' + Math.round(lo) + '° · 最高 ' + Math.round(hi) + '° · 温差 ' + Math.round(span) + '°</div>' +
      '</div></div>' +

    '<div class="card"><div class="card__hd"><h3>' + ic('target') + '今天怎么穿</h3></div>' +
      '<div class="card__bd"><div class="reading">' + ic('info') + '<span>' + esc(Weather.advice(d)) + '</span></div>' +
      (d.hours?.length ? '<div class="hr"></div><div class="tiny muted">未来几小时：' +
        d.hours.slice(0, 5).map(h => pad2(h.h) + ':00 ' + Math.round(h.t) + '°').join(' · ') + '</div>' : '') +
      '</div></div>' +

    '<div class="card"><div class="card__hd"><h3>' + ic('loc') + '常看的城市</h3>' +
      '<button class="btn btn--sm btn--ghost" id="wxAddCity">' + ic('plus') + '添加</button></div>' +
      '<div class="card__bd">' +
      '<div class="quickcities">' +
        '<button data-c="' + escAttr(JSON.stringify(st.city)) + '" style="background:var(--accent);border-color:var(--accent);color:#fff">' + esc(st.city.name) + '（当前）</button>' +
        hist.map(c => '<button data-c="' + escAttr(JSON.stringify(c)) + '">' + esc(c.name) + (c.region ? '<span style="opacity:.6"> · ' + esc(String(c.region).split(' · ')[0]) + '</span>' : '') + '</button>').join('') +
      '</div>' +
      '<p class="hint">点一下即可切换。数据来源 wttr.in / open-meteo，均为免费公开接口，无需登录。</p>' +
      '</div></div>';

  $$('.quickcities button[data-c]', box).forEach(b => {
    b.onclick = () => {
      try {
        const c = JSON.parse(b.dataset.c);
        st.city = { ...c, manual: true, source: 'history' };
        Store.save();
        toast('ok', '已切换到 ' + c.name);
        location.hash = '#/weather';
        renderWeather();
      } catch (e){}
    };
  });
  $('#wxAddCity').onclick = () => openCityPicker();
}

function openCityPicker(){
  const st = Store.db.settings;
  const d = drawer({
    title: '选择位置',
    sub: '默认按网络定位，也可以手动指定',
    body:
      '<div class="sect">' +
        '<h4>自动</h4>' +
        '<button class="btn btn--primary btn--block" id="cpLoc">' + ic('loc') + '使用当前位置（IP 定位）</button>' +
        '<p class="hint">通过 IP 粗略判断所在城市，精度到市级。首次使用会向定位服务发起一次请求。</p>' +
      '</div>' +
      '<div class="sect">' +
        '<h4>搜索城市</h4>' +
        '<div class="row row--tight" style="align-items:center">' +
          '<input class="inp" id="cpQ" placeholder="输入城市名，如 杭州 / Shenzhen" autocomplete="off" style="flex:1">' +
          '<button class="btn btn--primary" id="cpGo" style="height:37px">' + ic('search') + '</button>' +
        '</div>' +
        '<div id="cpRes"></div>' +
      '</div>' +
      '<div class="sect">' +
        '<h4>常用城市</h4>' +
        '<div class="quickcities" id="cpQuick"></div>' +
        '<p class="hint">搜索使用 open-meteo 地理编码，支持中文、拼音与英文。</p>' +
      '</div>'
  });

  const quick = $('#cpQuick', d.body);
  quick.innerHTML = (st.cityHistory || []).map((c, i) =>
    '<button data-i="' + i + '">' + esc(c.name) + '</button>').join('') || '<span class="tiny muted">暂无记录</span>';
  $$('button[data-i]', quick).forEach(b => {
    b.onclick = () => {
      const c = st.cityHistory[Number(b.dataset.i)];
      st.city = { ...c, manual: true, source: 'quick' };
      Store.save(); d.close();
      toast('ok', '已切换到 ' + c.name);
      renderWeather();
    };
  });

  $('#cpLoc', d.body).onclick = async () => {
    const btn = $('#cpLoc', d.body);
    btn.disabled = true; btn.innerHTML = ic('refresh', 'spin') + '定位中…';
    try {
      const c = await Weather.locate();
      st.city = { name: c.name, lat: c.lat, lon: c.lon, region: c.region, manual: false, source: 'ip' };
      pushCityHistory(st, { name: c.name, lat: c.lat, lon: c.lon, region: c.region });
      Store.save(); d.close();
      toast('ok', '定位成功', '当前城市：' + c.name);
      renderWeather();
    } catch (e){
      btn.disabled = false; btn.innerHTML = ic('loc') + '使用当前位置（IP 定位）';
      toast('err', '定位失败', '所有定位服务都不可用，可能是网络或浏览器限制。可以手动选择城市。', 7000);
    }
  };

  const input = $('#cpQ', d.body), resBox = $('#cpRes', d.body);
  const doSearch = async () => {
    const q = input.value.trim();
    if (q.length < 1) return;
    resBox.innerHTML = '<div class="skeleton" style="height:52px;margin-top:9px"></div>';
    try {
      const rs = await Weather.searchCity(q);
      if (!rs.length){ resBox.innerHTML = '<p class="hint">没有找到「' + esc(q) + '」，换个说法试试。</p>'; return; }
      resBox.innerHTML = '<div class="citypick">' + rs.map((r, i) =>
        '<button class="citypick__i" data-i="' + i + '"><b>' + esc(r.name) + '</b>' +
        (r.pop ? '<small class="num">' + abbr(r.pop) + '人</small>' : '') +
        '<small>' + esc(r.region || '') + '</small></button>').join('') + '</div>';
      $$('.citypick__i', resBox).forEach(b => {
        b.onclick = () => {
          const r = rs[Number(b.dataset.i)];
          st.city = { name: r.name, lat: r.lat, lon: r.lon, region: r.region, manual: true, source: 'search' };
          pushCityHistory(st, r);
          Store.save(); d.close();
          toast('ok', '已切换到 ' + r.name, r.region);
          renderWeather();
        };
      });
    } catch (e){
      resBox.innerHTML = '<p class="hint" style="color:var(--danger)">搜索失败：' + esc(e.message) + '</p>';
    }
  };
  $('#cpGo', d.body).onclick = doSearch;
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doSearch(); } });
  setTimeout(() => input.focus(), 320);
}
function pushCityHistory(st, c){
  st.cityHistory = [{ name: c.name, lat: c.lat, lon: c.lon, region: c.region || '' }]
    .concat((st.cityHistory || []).filter(x => x.name !== c.name)).slice(0, 12);
}
